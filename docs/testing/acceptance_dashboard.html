<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','PingFang SC',Menlo,monospace;font-size:13px;line-height:1.6;color:#172033;background:#f5f6f8}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:22px;margin-bottom:4px}
.sub{font-size:13px;color:#667085;margin-bottom:20px}

/* Module selector */
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #e4e7ec;background:#fff;white-space:nowrap}
.tab.active{background:#0e7490;color:#fff;border-color:#0e7490}
.tab.done{border-color:#059669}
.tab.done::before{content:'✅ '}
.tab.todo::before{content:'⚠️ '}

/* Steps */
.panel{display:none}
.panel.active{display:block}
.phase-box{background:#fff;border:1px solid #e4e7ec;border-radius:10px;margin-bottom:8px;overflow:hidden}
.phase-head{padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.phase-head:hover{background:#f8fafb}
.phase-head .num{width:22px;height:22px;border-radius:50%;background:#0e7490;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.phase-head .arrow{margin-left:auto;font-size:10px;color:#999;transition:transform .2s}
.phase-box.open .phase-head .arrow{transform:rotate(90deg)}
.phase-body{display:none;padding:0 16px 12px;border-top:1px solid #f0f2f5}
.phase-box.open .phase-body{display:block}

/* Command + check rows */
.cmd{background:#1e293b;color:#94a3b8;padding:8px 12px;border-radius:6px;font-size:12px;margin:8px 0;overflow-x:auto;white-space:pre}
.cmd::before{content:'$ ';color:#64748b}
.check{padding:6px 0;font-size:13px}
.check .ico{display:inline-block;width:18px}
.check.pass{color:#059669}
.check.fail{color:#dc2626}
.prompt{background:#f0f5f8;border-left:3px solid #0e7490;padding:8px 12px;border-radius:0 6px 6px 0;font-size:12px;margin:8px 0;color:#344054}
.prompt::before{content:'💬 Prompt: ';font-weight:700;color:#0e7490}

/* Action bar */
.actions{display:flex;gap:8px;margin-top:16px;padding:12px 0;border-top:2px solid #e4e7ec}
.btn{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid;text-decoration:none}
.btn-cmd{background:#fff;border-color:#e4e7ec;color:#344054}
.btn-html{background:#eff6ff;border-color:#bfdbfe;color:#2563eb}
.result-line{padding:8px 12px;background:#ecfdf3;border-radius:6px;font-weight:700;color:#059669;margin-top:8px}
</style>
</head>

  // Panel
  const panel = document.createElement('div');
  panel.className = 'panel' + (i === 0 ? ' active' : '');
  panel.id = `panel-${i}`;

  let html = `<div style="background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:16px 20px;margin-bottom:16px">
    <div style="font-size:18px;font-weight:700">${m.icon} ${m.name}
      <span style="font-size:13px;color:#667085;font-weight:400;margin-left:8px">${m.desc}</span>
    </div>
    <div style="margin-top:8px;font-size:13px">
      <span class="${m.done ? '' : ''}" style="padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;${m.done ? 'background:#ecfdf3;color:#059669' : 'background:#fff7ed;color:#b45309'}">${m.done ? '✅ 已验证 ' + m.score : '⚠️ 待验收'}</span>
    </div>
  </div>`;

  m.phases.forEach((p, pi) => {
    html += `<div class="phase-box${pi === 0 ? ' open' : ''}" id="phase-${i}-${pi}">
      <div class="phase-head" onclick="togglePhase(${i},${pi})">
        <span class="num">${pi}</span> ${p.t}
        <span class="arrow">▶</span>
      </div>
      <div class="phase-body">`;

    p.steps.forEach(s => {
      if (s.cmd) html += `<div class="cmd">${s.cmd}</div>`;
      if (s.prompt) html += `<div class="prompt">${s.prompt}</div>`;
      if (s.check === 'pass') html += `<div class="check pass"><span class="ico">✅</span> ${s.text}</div>`;
      if (s.check === 'fail') html += `<div class="check fail"><span class="ico">❌</span> ${s.text}</div>`;
      if (s.check === 'softpass') html += `<div class="check" style="color:#b45309"><span class="ico">⚠️</span> ${s.text}</div>`;
      if (s.note) html += `<div class="check" style="color:#0e7490"><span class="ico">📌</span> ${s.note}</div>`;
      if (s.result) html += `<div class="result-line">${s.result}</div>`;
    });

    html += `</div></div>`;
  });

  // Actions
  html += `<div class="actions">
    <a class="btn btn-cmd" href="#" onclick="copyCmd('${m.script}');return false">📋 ${m.script}</a>
    ${m.done ? `<a class="btn btn-html" href="../verification-results/${m.id}.html" target="_blank">📂 打开结果 HTML</a>` : ''}
  </div>`;

  panel.innerHTML = html;
  panels.appendChild(panel);
});

function switchModule(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}

function togglePhase(mi, pi) {
  document.getElementById(`phase-${mi}-${pi}`).classList.toggle('open');
}

function copyCmd(cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    event.target.textContent = '✅ 已复制!';
    setTimeout(() => event.target.textContent = '📋 ' + cmd, 1500);
  });
}
</script>
</body>
</html>
