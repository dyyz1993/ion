  <style>

    }

    }

    .tree-error {

      align-items: center;

    .user-message:hover .copy-link-btn,
    .assistant-message:hover .copy-link-btn,

      border-color: var(--success, #22c55e);
    }

    /* Highlight effect for deep-linked messages */
    .user-message.highlight,

      animation: highlight-pulse 2s ease-out;
    }

    @keyframes highlight-pulse {
      0% {
        box-shadow: 0 0 0 3px var(--accent);
      }
      100% {
        box-shadow: 0 0 0 0 transparent;

    .assistant-message > .message-timestamp {
      padding-left: var(--line-height);
    }

    .assistant-text {
      padding: var(--line-height);
      padding-bottom: 0;
    }

    .message-timestamp + .thinking-block {
      padding-top: 0;
    }

      padding-top: 0;
    }

    .thinking-text {
      padding: var(--line-height);
      color: var(--thinkingText);
      font-style: italic;
      white-space: pre-wrap;

    /* Tool execution */

    .tool-execution.pending { background: var(--toolPendingBg); }

    .tool-header, .tool-name {

    .tool-path {

    }

    .line-numbers {
      color: var(--warning);
    }

    .line-count {
      color: var(--dim);
    }

    .tool-command {

      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;

    }

    .tool-output {

      word-break: break-word;
      font-family: inherit;
      overflow-x: auto;

    .tool-output > div,

      line-height: var(--line-height);

    .output-preview > div:not(.expand-hint),
    .output-full > div:not(.expand-hint) {
      white-space: pre-wrap;
    }

    .tool-output pre {
      margin: 0;
      padding: 0;
      font-family: inherit;
      color: inherit;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .tool-output code {
      padding: 0;
      background: none;
      color: var(--text);
    }

    .tool-output.expandable {
      cursor: pointer;

    .tool-output.expandable:hover {
      opacity: 0.9;
    }

    .tool-output.expandable .output-full {
      display: none;
    }

    .tool-output.expandable.expanded .output-preview {
      display: none;
    }

    .tool-output.expandable.expanded .output-full {
      display: block;
    }

    .ansi-line {
      white-space: pre;
    }

    .tool-images {
    }

    .tool-image {
      max-width: 100%;
      max-height: 500px;
      border-radius: 4px;
      margin: var(--line-height) 0;
    }

    .expand-hint {
      color: var(--toolOutput);
    }

    /* Diff */
    .tool-diff {
      font-size: 11px;
      overflow-x: auto;
      white-space: pre;
    }

    .diff-added { color: var(--toolDiffAdded); }
    .diff-removed { color: var(--toolDiffRemoved); }
    .diff-context { color: var(--toolDiffContext); }

    /* Model change */
    .model-change {
      padding: 0 var(--line-height);

    }

    .model-name {
      color: var(--borderAccent);
      font-weight: bold;
    }

    /* Compaction / Branch Summary - matches customMessage colors from TUI */
    .compaction {

    .compaction-collapsed {

      margin-top: var(--line-height);
    }

    .compaction.expanded .compaction-collapsed {
      display: none;
    }

    .compaction.expanded .compaction-content {
      display: block;
    }

    /* System prompt */
    .system-prompt {
      background: var(--customMessageBg);
      padding: var(--line-height);
      border-radius: 4px;
      margin-bottom: var(--line-height);
    }

    .system-prompt.expandable {

    .system-prompt-header {
      font-weight: bold;
      color: var(--customMessageLabel);

    .system-prompt-preview {

    .system-prompt-expand-hint {
      color: var(--muted);

    .system-prompt-full {
      display: none;
      color: var(--customMessageText);
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 11px;
      margin-top: var(--line-height);
    }

    .system-prompt.expanded .system-prompt-preview,
    .system-prompt.expanded .system-prompt-expand-hint {
      display: none;
    }

    .system-prompt.expanded .system-prompt-full {
      display: block;
    }

    .system-prompt.provider-prompt {
      border-left: 3px solid var(--warning);
    }

    .system-prompt-note {
      font-size: 10px;
      font-style: italic;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Tools list */
    .tools-list {
      background: var(--customMessageBg);
      padding: var(--line-height);
      border-radius: 4px;
      margin-bottom: var(--line-height);
    }

    .tools-header {
      font-weight: bold;
      color: var(--customMessageLabel);
      margin-bottom: var(--line-height);
    }

    .tool-item {
      font-size: 11px;
    }

    .tool-item-name {
      font-weight: bold;
      color: var(--text);
    }

    .tool-item-desc {
      color: var(--dim);
    }

    .tool-params-hint {
      color: var(--muted);
      font-style: italic;
    }

    .tool-item:has(.tool-params-hint) {
      cursor: pointer;
    }

    .tool-params-hint::after {
      content: '[click to show parameters]';
    }

    .tool-item.params-expanded .tool-params-hint::after {
      content: '[hide parameters]';
    }

    .tool-params-content {
      display: none;
      margin-top: 4px;
      margin-left: 12px;
      padding-left: 8px;

    }

    .tool-item.params-expanded .tool-params-content {
      display: block;
    }

    .tool-param {
      margin-bottom: 4px;

      font-weight: bold;
      color: var(--text);
    }

    .tool-param-type {
      color: var(--dim);
      font-style: italic;
    }

      color: var(--warning, #e8a838);

    .tool-param-optional {
      color: var(--dim);
      font-size: 10px;

    .tool-param-desc {

    .hook-message {

      padding: var(--line-height);
      border-radius: 4px;
    }

    .hook-type {
      color: var(--customMessageLabel);
      font-weight: bold;
    }

    /* Skill invocation - matches compaction style (clickable, collapsed by default) */

      background: var(--customMessageBg);

      position: relative;

    .branch-summary {
      background: var(--customMessageBg);
      padding: var(--line-height);
      border-radius: 4px;
    }

    .branch-summary-header {
      font-weight: bold;
      color: var(--borderAccent);
    }

    /* Images */

    .message-image {

      margin: var(--line-height) 0;
    }

    /* Markdown content */
    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      color: var(--mdHeading);
      margin: var(--line-height) 0 0 0;
      font-weight: bold;
    }

    .markdown-content h1 { font-size: 1em; }
    .markdown-content h2 { font-size: 1em; }
    .markdown-content h3 { font-size: 1em; }
    .markdown-content h4 { font-size: 1em; }
    .markdown-content h5 { font-size: 1em; }
    .markdown-content h6 { font-size: 1em; }
    .markdown-content p { margin: 0; }
    .markdown-content p + p { margin-top: var(--line-height); }

    .markdown-content a {
      color: var(--mdLink);
      text-decoration: underline;
    }

      border-radius: 3px;
      font-family: inherit;

      background: transparent;

      display: block;

      color: var(--text);
    }

      color: var(--mdQuote);
      font-style: italic;
    }

    .markdown-content ul,
    .markdown-content ol {
      margin: var(--line-height) 0;
      padding-left: calc(var(--line-height) * 2);
    }

    .markdown-content li { margin: 0; }
    .markdown-content li::marker { color: var(--mdListBullet); }

    .markdown-content hr {
      border: none;
      border-top: 1px solid var(--mdHr);
      margin: var(--line-height) 0;

    .markdown-content table {
      border-collapse: collapse;
      margin: 0.5em 0;
      width: 100%;
    }

    .markdown-content th,
    .markdown-content td {
      border: 1px solid var(--mdCodeBlockBorder);

    }

    .markdown-content th {
      background: rgba(128, 128, 128, 0.1);
      font-weight: bold;
    }

    .markdown-content img {
      max-width: 100%;
      border-radius: 4px;
    }

    /* Syntax highlighting */
    .hljs { background: transparent; color: var(--text); }
    .hljs-comment, .hljs-quote { color: var(--syntaxComment); }
    .hljs-keyword, .hljs-selector-tag { color: var(--syntaxKeyword); }
    .hljs-number, .hljs-literal { color: var(--syntaxNumber); }
    .hljs-string, .hljs-doctag { color: var(--syntaxString); }
    /* Function names: hljs v11 uses .hljs-title.function_ compound class */
    .hljs-function, .hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--syntaxFunction); }
    /* Types: hljs v11 uses .hljs-title.class_ for class names */
    .hljs-type, .hljs-class, .hljs-title.class_, .hljs-built_in { color: var(--syntaxType); }
    .hljs-attr, .hljs-variable, .hljs-variable.language_, .hljs-params, .hljs-property { color: var(--syntaxVariable); }
    .hljs-meta, .hljs-meta .hljs-keyword, .hljs-meta .hljs-string { color: var(--syntaxKeyword); }
    .hljs-operator { color: var(--syntaxOperator); }
    .hljs-punctuation { color: var(--syntaxPunctuation); }
    .hljs-subst { color: var(--text); }

    /* Footer */
    .footer {
      margin-top: 48px;
      padding: 20px;
      text-align: center;
      color: var(--dim);
      font-size: 10px;
    }

    /* Mobile */
    #hamburger {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 3px 8px;
      font-size: 12px;
      font-family: inherit;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--dim);
      border-radius: 3px;
      cursor: pointer;
    }

    #hamburger:hover {
      color: var(--text);
      border-color: var(--text);
    }



    #sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 98;
    }

    @media (max-width: 900px) {
      #sidebar {
        position: fixed;
        left: 0;
        width: min(var(--sidebar-width), 100vw);
        min-width: min(var(--sidebar-width), 100vw);
        max-width: min(var(--sidebar-width), 100vw);
        top: 0;
        bottom: 0;
        height: 100vh;
        z-index: 99;
        transform: translateX(-100%);
        transition: transform 0.3s;
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar-resizer {
        display: none;
      }

      #sidebar-overlay.open {
        display: block;
      }

      #hamburger {
        display: block;
      }

      .sidebar-close {
        display: block;
      }

      #content {
        padding: var(--line-height) 16px;
      }

      #content > * {
        max-width: 100%;
      }
    }

    @media print {
      #sidebar, #sidebar-resizer, #sidebar-toggle { display: none !important; }
      body { background: white; color: black; }
      #content { max-width: none; }
    }

/* ION: only collapse tool output when opening it reveals more than three lines. */
.tool-output:not(.expandable)[data-ion-output-foldable="true"]:not(.expanded) {
  max-height: var(--ion-tool-output-preview-height, 100px);
  overflow: hidden;
  position: relative;
  cursor: pointer;
}
.tool-output:not(.expandable)[data-ion-output-foldable="true"]:not(.expanded)::after {

  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 20px;
  background: linear-gradient(transparent, rgba(246,248,250,0.95) 60%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #58a6ff;
}

  
    /* ION export shell: self-contained, responsive and optimized for long sessions. */
    :root {
      --ion-shell-max: 1560px;
      --ion-sidebar-width: 320px;
      --ion-radius-sm: 8px;
      --ion-radius-lg: 16px;
      --ion-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 12px 32px rgba(16, 24, 40, 0.06);
      --line-height: 20px;
      --sidebar-width: var(--ion-sidebar-width);
    }
    body {
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(14, 116, 144, 0.08), transparent 28rem),
        #f3f5f7;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: var(--line-height);
    }
    code, pre, .tree-container, .info-value, .tool-output {
      font-family: "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
    }

    /* Top session masthead */
    #ion-stats-banner {
      color: #f8fafc;
      background:
        radial-gradient(circle at 82% -80%, rgba(45, 212, 191, 0.28), transparent 26rem),
        linear-gradient(112deg, #101828 0%, #17233b 62%, #12394a 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .ion-stats-inner {
      width: min(100%, var(--ion-shell-max));
      min-height: 112px;
      margin: 0 auto;
      padding: 22px 28px;
      display: grid;
      grid-template-columns: minmax(300px, 1fr) auto;
      gap: 18px 36px;
      align-items: center;
    }
    .ion-title-kicker,
    .ion-overview-kicker {
      display: block;
      margin-bottom: 5px;
      color: #67e8f9;
      font: 700 10px/1.2 "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .ion-session-title {
      margin: 0;
      color: #fff;
      font-family: Charter, "Iowan Old Style", Georgia, serif;
      font-size: clamp(21px, 2vw, 30px);
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    .ion-session-metrics {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .ion-session-metric {
      min-width: 104px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
    }
    .ion-session-metric--model { min-width: 180px; }
    .ion-metric-label {
      display: block;
      margin-bottom: 3px;
      color: #9fb0c8;
      font: 700 9px/1.2 "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .ion-session-metric strong {
      display: block;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .ion-tool-badges {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: -8px;
    }
    .ion-tool-badge {
      padding: 3px 9px;
      border: 1px solid rgba(103, 232, 249, 0.2);
      border-radius: 999px;
      color: #c8f7ff;
      background: rgba(14, 116, 144, 0.2);
      font: 600 10px/1.4 "SFMono-Regular", Menlo, monospace;
    }

    /* Entry filters sit above an order-proportional, gap-free timeline. */
    #ion-ext-viz {
      width: min(100%, var(--ion-shell-max));
      margin: 18px auto 0;
      padding: 0 28px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .ion-overview-panel {
      min-width: 0;
      padding: 16px 18px;
      border: 1px solid #e1e6ec;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.03);
    }
    .ion-overview-heading {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }
    .ion-overview-heading strong {
      color: #101828;
      font-size: 12px;
    }
    .ion-overview-meta {
      margin-left: auto;
      color: var(--muted);
      font: 500 10px/1.4 "SFMono-Regular", Menlo, monospace;
      white-space: nowrap;
    }
    .ion-flow-metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(96px, 1fr));
      gap: 8px;
    }
    .ion-flow-metric {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid #e4e7ec;
      border-radius: 9px;
      background: #f8fafc;
    }
    .ion-flow-metric strong {
      display: block;
      color: #101828;
      font: 700 17px/1.2 "SFMono-Regular", Menlo, monospace;
    }
    .ion-flow-metric span {
      display: block;
      margin-top: 3px;
      color: #667085;
      font: 600 9px/1.35 "SFMono-Regular", Menlo, monospace;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .ion-flow-groups {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .ion-flow-group {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ion-flow-group-label {
      width: 78px;
      padding-top: 4px;
      color: #667085;
      font: 650 9px/1.4 "SFMono-Regular", Menlo, monospace;
      text-transform: uppercase;
    }
    .ion-flow-chip,
    .ion-entry-provenance-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 100%;
      padding: 3px 7px;
      border: 1px solid #d0d5dd;
      border-radius: 999px;
      color: #475467;
      background: #fff;
      font: 600 9px/1.35 "SFMono-Regular", Menlo, monospace;
      overflow-wrap: anywhere;
    }
    .ion-entry-type-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ion-entry-filter,
    .ion-entry-filter-reset {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid color-mix(in srgb, var(--entry-color) 48%, white);
      border-radius: 999px;
      color: color-mix(in srgb, var(--entry-color) 82%, #101828);
      background: color-mix(in srgb, var(--entry-color) 9%, white);
      font: 650 10px/1.4 "SFMono-Regular", Menlo, monospace;
      cursor: pointer;
      transition: opacity 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .ion-entry-filter:hover { background: color-mix(in srgb, var(--entry-color) 16%, white); }
    .ion-entry-filter[aria-pressed="false"] { opacity: 0.36; filter: grayscale(0.6); }
    .ion-entry-filter-count { opacity: 0.64; font-weight: 550; }
    .ion-entry-filter-reset {
      --entry-color: #667085;
      color: #475467;
      border-color: #d0d5dd;
      background: #fff;
    }
    .ion-entry-filter-reset:disabled { opacity: 0.35; cursor: default; }
    .ion-entry-swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--entry-color);
      box-shadow: 0 0 0 1px rgba(16, 24, 40, 0.08);
    }
    .ion-timeline-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0 4px;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }
    .ion-timeline-track {
      position: relative;
      display: flex;
      width: var(--timeline-content-width, 12px);
      min-width: 12px;
      height: 32px;
      overflow: visible;
      border: 1px solid #e4e7ec;
      border-radius: 7px;
      background: #fbfcfd;
    }
    .ion-timeline-bar {
      position: relative;
      flex: 0 0 12px;
      top: 3px;
      width: 12px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      z-index: 1;
    }
    .ion-timeline-bar::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      border-right: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 0;
      background: var(--bar-color);
      opacity: 0.9;
      transition: opacity 120ms ease, transform 120ms ease, box-shadow 120ms ease;
    }
    .ion-timeline-bar:hover,
    .ion-timeline-bar:focus-visible {
      z-index: 3;
      outline: none;
    }
    .ion-timeline-bar:hover::before,
    .ion-timeline-bar:focus-visible::before {
      opacity: 1;
      transform: scaleY(1.08);
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--bar-color);
    }
    .ion-timeline-empty {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 12px;
      color: var(--muted);
      font-size: 10px;
    }
    .ion-timeline-axis {
      display: flex;
      justify-content: flex-start;
      gap: 12px;
      margin-top: 6px;
      color: #98a2b3;
      font: 500 9px/1.4 "SFMono-Regular", Menlo, monospace;
    }
    .ion-timeline-notice {
      min-height: 16px;
      margin-top: 4px;
      color: #667085;
      font: 500 9px/1.4 "SFMono-Regular", Menlo, monospace;
      text-align: center;
    }
    .ion-entry-jump-target {
      scroll-margin-block: 96px;
      animation: ion-entry-jump-flash 1.8s ease-out;
    }
    @keyframes ion-entry-jump-flash {
      0%, 24% { box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.34); }
      100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
    }
    .ion-timeline-tooltip {
      position: fixed;
      z-index: 1000;
      width: min(340px, calc(100vw - 24px));
      padding: 12px 13px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #f8fafc;
      background: rgba(16, 24, 40, 0.96);
      box-shadow: 0 16px 40px rgba(16, 24, 40, 0.24);
      backdrop-filter: blur(10px);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 100ms ease, transform 100ms ease;
    }
    .ion-timeline-tooltip.is-visible { opacity: 1; transform: translateY(0); }
    .ion-tooltip-type {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      color: #fff;
      font: 700 10px/1.3 "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .ion-tooltip-meta {
      margin-bottom: 7px;
      color: #9fb0c8;
      font: 500 9px/1.45 "SFMono-Regular", Menlo, monospace;
    }
    .ion-tooltip-summary {
      color: #e4e7ec;
      font-size: 11px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    /* Center the whole workspace and keep the navigation/content ratio useful. */
    #app {
      width: min(100%, var(--ion-shell-max));
      min-height: 0;
      margin: 0 auto;
      padding: 18px 28px 40px;
      display: grid;
      grid-template-columns: var(--ion-sidebar-width) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    #sidebar {
      width: 100%;
      min-width: 0;
      max-width: none;
      height: calc(100vh - 36px);
      top: 18px;
      overflow: hidden;
      border: 1px solid #e1e6ec;
      border-radius: var(--ion-radius-lg);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--ion-shadow);
    }
    #sidebar-resizer { display: none; }
    .sidebar-header {
      padding: 18px 14px 8px;
      border-bottom: 1px solid #edf0f3;
    }
    .sidebar-header::before {
      content: "SESSION MAP";
      display: block;
      padding: 0 8px 8px;
      color: #475467;
      font: 700 10px/1.2 "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.13em;
    }
    .sidebar-controls { padding: 0 8px 5px; }
    .sidebar-search {
      padding: 8px 10px;
      border-color: #d9e0e8;
      border-radius: 8px;
      background: #f8fafc;
    }
    .sidebar-filters { gap: 5px; padding: 5px 8px 8px; }
    .filter-btn { border: 0; border-radius: 6px; padding: 4px 7px; }
    .filter-btn.active { color: #fff; background: #0e7490; }
    .tree-container { padding: 10px 5px; }
    .tree-node { padding: 2px 10px; line-height: 16px; border-radius: 5px; }
    .tree-status { padding: 8px 14px; border-top: 1px solid #edf0f3; }

    #content {
      width: 100%;
      min-width: 0;
      overflow: visible;
      padding: 0;
      align-items: stretch;
    }
    #content > * { width: 100%; max-width: none; }
    .header {
      padding: 20px;
      border: 1px solid #e1e6ec;
      border-radius: var(--ion-radius-lg);
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--ion-shadow);
    }
    .header h1 { display: none; }
    .help-bar {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #edf0f3;
      color: var(--muted);
    }
    .help-hint { font: 500 10px/1.4 "SFMono-Regular", Menlo, monospace; }
    .help-actions { gap: 6px; }
    .header-toggle-btn,
    .download-json-btn {
      padding: 5px 9px;
      border-color: #d9e0e8;
      border-radius: 7px;
      color: #344054;
      background: #fff;
    }
    .header-info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }
    .info-item {
      min-width: 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f7f9fb;
    }
    .info-label { min-width: 92px; color: #667085; }
    .info-value { min-width: 0; color: #172033; overflow-wrap: anywhere; }
    #messages { gap: 12px; }

    /* Long Entries keep their real rendered content visible for a few lines. */
    #messages > [id^="entry-"].ion-entry-fold {
      position: relative;
      overflow: hidden;
    }
    .ion-entry-fold-content {
      display: block;
      overflow: hidden;
      max-height: var(--ion-entry-preview-height, 132px);
    }
    .ion-entry-fold-hint {
      display: block;
      width: max-content;
      max-width: 100%;
      margin: 7px 0 0;
      padding: 4px 7px;
      border: 0;
      border-radius: 5px;
      color: #667085;
      background: transparent;
      font: italic 500 11px/1.4 "SFMono-Regular", Menlo, monospace;
      text-align: left;
      cursor: pointer;
    }
    .ion-entry-fold-hint:hover { color: #0e7490; background: rgba(14, 116, 144, 0.07); }
    .ion-entry-fold-hint:focus-visible {
      outline: 2px solid var(--ion-entry-accent, #0e7490);
      outline-offset: 1px;
    }
    .ion-entry-fold-hint[hidden] { display: none; }
    .ion-entry-fold[data-ion-entry-expanded="true"] .ion-entry-fold-content {
      max-height: none;
    }
    .ion-entry-fold[data-ion-entry-foldable="false"] .ion-entry-fold-content {
      max-height: none;
    }
    .ion-entry-fold.compaction .compaction-collapsed { display: none !important; }
    .ion-entry-fold.compaction .compaction-content { display: block !important; }

    /* Message roles: quiet cards with an unmistakable edge marker. */
    .user-message {
      background: #edf6ff !important;
      border: 1px solid #d6e8f8 !important;
      border-left: 3px solid #2e90fa !important;
      padding: 14px 16px !important;
      border-radius: 12px !important;
      margin-bottom: 0 !important;
    }
    /* Memory/context injection: collapse by default to avoid visual repetition */
    .user-message.memory-injection {
      background: #f8fafc !important;
      border-left: 3px solid #94a3b8 !important;
      border-color: #e2e8f0 !important;
      max-height: 60px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }
    .user-message.memory-injection::after {
      content: '📝 Memory 注入（点击展开）';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 24px;
      background: linear-gradient(transparent, #f8fafc 60%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 11px;
      color: #64748b;
      padding-bottom: 2px;
    }
    .user-message.memory-injection.expanded {
      max-height: none;
    }
    .user-message.memory-injection.expanded::after {
      display: none;
    }
    .user-message::before {
      content: "USER";
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #175cd3;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .assistant-message {
      padding: 14px 16px !important;
      border: 1px solid #dce7e3 !important;
      border-left: 3px solid #12b76a !important;
      background: #fbfefc !important;
      border-radius: 12px !important;
      margin-bottom: 0 !important;
    }
    .assistant-message::before {
      content: "ASSISTANT";
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #067647;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tool-execution {
      border-left: 3px solid #f79009 !important;
      background: #fffbeb !important;
      padding: 8px 12px !important;
      border-radius: 8px !important;
      margin-bottom: 8px !important;
    }
    .tool-execution::before {
      content: "TOOL RESULT";
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #f59e0b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* custom_message（sub_session_separator 等）特殊样式 */
    .custom-message {
      border-left: 3px solid #8b5cf6 !important;
      background: #f5f3ff !important;
      padding: 12px 16px !important;
      border-radius: 10px !important;
      margin-bottom: 8px !important;
    }
    /* 不同 customType 用不同颜色（用户反馈：自定义插入应有视觉区分）*/
    .hook-message[data-custom-type="diagnostics"] {
      border-left-color: #dc2626 !important;
      background: #fef2f2 !important;
    }
    .hook-message[data-custom-type="diagnostics"][data-has-errors="false"] {
      border-left-color: #10b981 !important;
      background: #f0fdf4 !important;
    }
    .hook-message[data-custom-type="bash_result"] {
      border-left-color: #f59e0b !important;
      background: #fffbeb !important;
      font-family: 'Menlo', 'Monaco', monospace !important;
      font-size: 12px !important;
    }
    .hook-message[data-custom-type="dev_servers"] {
      border-left-color: #ec4899 !important;
      background: #fdf2f8 !important;
    }
    .hook-message[data-custom-type="session_name"] {
      border-left-color: #0891b2 !important;
      background: #ecfeff !important;
    }
    /* session_name 卡片：用更显著的渐变背景，区别于普通 custom_message */
    .custom-message[data-custom-type="session_name"],
    .custom-message.session-name-card {
      border-left: 3px solid #0891b2 !important;
      background: linear-gradient(90deg, #ecfeff 0%, #cffafe 100%) !important;
      padding: 10px 16px !important;
      border-radius: 6px !important;
      margin: 8px 0 !important;
      font-size: 13px !important;
    }
    /* tree-view 里 session_name 节点也用青色高亮 */
    .tree-node[data-custom-type="session_name"] .tree-custom {
      color: #0891b2 !important;
      font-weight: 600 !important;
    }
    /* hook_event 审计卡片：判断方式 / Agent 推理过程 */
    .hook-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #e2e8f0;
    }
    .hook-meta-item {
      font-size: 12px;
      color: #64748b;
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .hook-meta-item b {
      color: #475569;
      font-weight: 600;
    }
    .hook-reasoning {
      margin-top: 6px;
    }
    .hook-reasoning summary {
      font-size: 12px;
      color: #6366f1;
      cursor: pointer;
      user-select: none;
    }
    .hook-reasoning summary:hover {
      text-decoration: underline;
    }
    .hook-reasoning-text {
      margin-top: 6px;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      color: #475569;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ion-generic-entry {
      position: relative;
      padding: 10px 13px;
      border: 1px solid #e2e8f0;
      border-left: 3px solid #667085;
      border-radius: 9px;
      background: #f8fafc;
      color: #344054;
    }
    .ion-generic-entry-type {
      margin-bottom: 4px;
      color: #475467;
      font: 700 10px/1.35 "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.03em;
    }
    .ion-generic-entry-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 500 11px/1.55 "SFMono-Regular", Menlo, monospace;
    }
    .ion-entry-provenance {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 7px 0 5px;
      padding-top: 7px;
      border-top: 1px dashed #d0d5dd;
    }
    .ion-entry-provenance-chip[data-kind="phase"] {
      color: #175cd3;
      border-color: #b2ddff;
      background: #eff8ff;
    }
    .ion-entry-provenance-chip[data-kind="source"] {
      color: #6941c6;
      border-color: #d9d6fe;
      background: #f4f3ff;
    }
    .ion-entry-provenance-chip[data-kind="llm"] {
      color: #027a48;
      border-color: #abefc6;
      background: #ecfdf3;
    }
    .ion-entry-provenance-chip[data-kind="hidden"] {
      color: #b54708;
      border-color: #fedf89;
      background: #fffaeb;
    }
    .ion-entry-filter-hidden { display: none !important; }
    .ion-entry-nested-events {
      display: grid;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #d0d5dd;
    }
    .ion-entry-nested-events > .hook-message {
      margin: 0 !important;
      padding: 7px 9px !important;
      border: 1px solid #ddd6fe !important;
      border-left: 3px solid #8b5cf6 !important;
      border-radius: 7px !important;
      background: #f5f3ff !important;
      font-size: 11px !important;
    }
    .ion-entry-nested-events > .hook-message .message-timestamp {
      margin-bottom: 3px;
    }
    .ion-entry-nested-events > .hook-message .hook-type {
      font-size: 9px;
    }
    /* ION: 每个 toolCall 独立一行 + 间距 + 背景色（对标 toolResult） */
    .assistant-message .tool-execution {
      display: block !important;
      margin-bottom: 8px !important;
      padding: 8px 12px !important;
      border-radius: 8px !important;
      border-left: 3px solid #f59e0b !important;
      background: #fffbeb !important;
    }
    .assistant-message .tool-execution.error {
      border-left-color: #dc2626 !important;
      background: #fef2f2 !important;
    }
    .assistant-message .tool-execution.success {
      border-left-color: #10b981 !important;
      background: #f0fdf4 !important;
    }
    /* ION: 输出折叠——头 N 行 + 尾 N 行（中间压缩，不是只折叠尾部） */
    .expandable-output .output-tail {
      display: block !important;
    }
    .tool-output:not(.expandable)[data-ion-output-foldable="true"]:not(.expanded)::after {
      color: #0e7490;
      background: linear-gradient(transparent, rgba(248, 250, 252, 0.98) 56%);
    }

    @media (max-width: 1100px) {
      .ion-stats-inner { grid-template-columns: 1fr; }
      .ion-session-metrics { flex-wrap: wrap; }
      .ion-tool-badges { grid-column: auto; margin-top: -6px; }
      #ion-ext-viz { grid-template-columns: 1fr; }
      #app { grid-template-columns: 280px minmax(0, 1fr); }
    }
    @media (max-width: 900px) {
      .ion-stats-inner { min-height: 0; padding: 18px 20px; }
      .ion-title-block { padding-left: 44px; }
      .ion-session-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ion-session-metric, .ion-session-metric--model { min-width: 0; }
      #ion-ext-viz { margin-top: 12px; padding: 0 12px; }
      #app { display: block; padding: 12px 12px 28px; }
      #sidebar {
        width: min(var(--sidebar-width), calc(100vw - 24px));
        min-width: min(var(--sidebar-width), calc(100vw - 24px));
        max-width: min(var(--sidebar-width), calc(100vw - 24px));
        height: 100vh;
        top: 0;
        border-radius: 0 14px 14px 0;
      }
      #content { padding: 0; }
      #hamburger {
        top: 12px;
        left: 12px;
        padding: 7px 9px;
        border-color: rgba(255, 255, 255, 0.3);
        color: #fff;
        background: rgba(16, 24, 40, 0.76);
        backdrop-filter: blur(8px);
      }
      .header-info { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .ion-session-title { font-size: 20px; }
      .ion-session-metrics { grid-template-columns: 1fr; }
      .ion-overview-panel { padding: 14px; }
      .ion-flow-metrics { grid-template-columns: repeat(3, minmax(86px, 1fr)); }
      .header { padding: 14px; border-radius: 12px; }
      .help-hint { display: none; }
      .help-actions { width: 100%; }
      .header-toggle-btn, .download-json-btn { flex: 1; }
      .info-item { display: block; }
      .info-label { display: block; min-width: 0; margin: 0 0 2px; }
    }
    @media print {
      #ion-stats-banner { background: #fff !important; color: #101828; border-bottom: 2px solid #101828; }
      .ion-session-title, .ion-session-metric strong { color: #101828; }
      #ion-ext-viz, #app { width: 100%; max-width: none; padding-left: 0; padding-right: 0; }
      #ion-ext-viz { display: block; }
      .ion-overview-panel { margin-bottom: 10px; box-shadow: none; }
      #content { display: block; }
      .header, .user-message, .assistant-message { box-shadow: none; break-inside: avoid; }
    }
    </style>
</head>
