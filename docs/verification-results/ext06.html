<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>请求删除目录的命令执行结果</title>
  <style>
    :root {
      
      --text: #172033;
      --muted: #667085;
      --dim: #98a2b3;
      --accent: #0e7490;
      --success: #059669;
      --warning: #b45309;
      --error: #dc2626;
      --border: #d9e0e8;
      --borderAccent: #0e7490;
      --selectedBg: #e7f3f5;
      --hover: #f2f6f8;
      --userMessageBg: #eef6ff;
      --userMessageText: #172033;
      --thinkingText: #667085;
      --toolPendingBg: #fff7ed;
      --toolSuccessBg: #ecfdf3;
      --toolErrorBg: #fff1f2;
      --toolOutput: #344054;
      --toolDiffAdded: #067647;
      --toolDiffRemoved: #b42318;
      --toolDiffContext: #667085;
      --customMessageBg: #f4f3ff;
      --customMessageLabel: #6941c6;
      --customMessageText: #344054;
      --mdHeading: #101828;
      --mdLink: #0e7490;
      --mdCode: #344054;
      --mdCodeBlockBorder: #d0d5dd;
      --mdQuote: #475467;
      --mdQuoteBorder: #98a2b3;
      --mdListBullet: #0e7490;
      --mdHr: #e4e7ec;
      --syntaxComment: #667085;
      --syntaxKeyword: #9e165f;
      --syntaxNumber: #175cd3;
      --syntaxString: #067647;
      --syntaxFunction: #6941c6;
      --syntaxType: #b54708;
      --syntaxVariable: #344054;
      --syntaxOperator: #475467;
      --syntaxPunctuation: #667085;
      
      --body-bg: #fafafa;
      --container-bg: #ffffff;
      --info-bg: #f5f5f5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --line-height: 18px; /* 12px font * 1.5 */
      --sidebar-width: 400px;
      --sidebar-min-width: 240px;
      --sidebar-max-width: 840px;
      --sidebar-resizer-width: 6px;
    }

    body {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
      font-size: 12px;
      line-height: var(--line-height);
      color: var(--text);
      background: var(--body-bg);
    }

    body.sidebar-resizing {
      cursor: col-resize;
      user-select: none;
    }

    #app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      max-width: var(--sidebar-width);
      background: var(--container-bg);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid var(--dim);
    }

    #sidebar-resizer {
      width: var(--sidebar-resizer-width);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      cursor: col-resize;
      touch-action: none;
      background: transparent;
      border-right: 1px solid transparent;
    }

    #sidebar-resizer:hover,
    body.sidebar-resizing #sidebar-resizer {
      background: var(--selectedBg);
      border-right-color: var(--dim);
    }

    .sidebar-header {
      padding: 8px 12px;
      flex-shrink: 0;
    }

    .sidebar-controls {
      padding: 8px 8px 4px 8px;
    }

    .sidebar-search {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 8px;
      font-size: 11px;
      font-family: inherit;
      background: var(--body-bg);
      color: var(--text);
      border: 1px solid var(--dim);
      border-radius: 3px;
    }

    .sidebar-filters {
      display: flex;
      padding: 4px 8px 8px 8px;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .sidebar-search:focus {
      outline: none;
      border-color: var(--accent);
    }

    .sidebar-search::placeholder {
      color: var(--muted);
    }

    .filter-btn {
      padding: 3px 8px;
      font-size: 10px;
      font-family: inherit;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--dim);
      border-radius: 3px;
      cursor: pointer;
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: var(--body-bg);
      border-color: var(--accent);
    }

    .sidebar-close {
      display: none;
      padding: 3px 8px;
      font-size: 12px;
      font-family: inherit;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--dim);
      border-radius: 3px;
      cursor: pointer;
      margin-left: auto;
    }

    .sidebar-close:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .tree-container {
      flex: 1;
      overflow: auto;
      padding: 4px 0;
    }

    .tree-node {
      padding: 0 8px;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      font-size: 11px;
      line-height: 13px;
      white-space: nowrap;
    }

    .tree-node:hover {
      background: var(--selectedBg);
    }

    .tree-node.active {
      background: var(--selectedBg);
    }

    .tree-node.active .tree-content {
      font-weight: bold;
    }

    .tree-node.in-path {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .tree-node:not(.in-path) {
      opacity: 0.5;
    }

    .tree-node:not(.in-path):hover {
      opacity: 1;
    }

    .tree-prefix {
      color: var(--muted);
      flex-shrink: 0;
      font-family: monospace;
      white-space: pre;
    }

    .tree-marker {
      color: var(--accent);
      flex-shrink: 0;
    }

    .tree-content {
      color: var(--text);
    }

    .tree-role-user {
      color: var(--accent);
    }

    .tree-role-skill {
      color: var(--customMessageLabel);
    }

    .tree-role-assistant {
      color: var(--success);
    }

    .tree-role-tool {
      color: var(--muted);
    }

    .tree-muted {
      color: var(--muted);
    }

    .tree-error {
      color: var(--error);
    }

    .tree-compaction {
      color: var(--borderAccent);
    }

    .tree-branch-summary {
      color: var(--warning);
    }

    .tree-custom-message {
      color: var(--customMessageLabel);
    }

    .tree-status {
      padding: 4px 12px;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* Main content */
    #content {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: var(--line-height) calc(var(--line-height) * 2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #content > * {
      width: 100%;
      max-width: 800px;
    }

    /* Help bar */
    .help-bar {
      font-size: 11px;
      color: var(--warning);
      margin-bottom: var(--line-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .help-hint {
      flex: 1 1 240px;
    }

    .help-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-toggle-btn,
    .download-json-btn {
      font-size: 10px;
      padding: 2px 8px;
      background: var(--container-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .header-toggle-btn:hover,
    .download-json-btn:hover {
      background: var(--hover);
      border-color: var(--borderAccent);
    }

    /* Header */
    .header {
      background: var(--container-bg);
      border-radius: 4px;
      padding: var(--line-height);
      margin-bottom: var(--line-height);
    }

    .header h1 {
      font-size: 12px;
      font-weight: bold;
      color: var(--borderAccent);
      margin-bottom: var(--line-height);
    }

    .header-info {
      display: flex;
      flex-direction: column;
      gap: 0;
      font-size: 11px;
    }

    .info-item {
      color: var(--dim);
      display: flex;
      align-items: baseline;
    }

    .info-label {
      font-weight: 600;
      margin-right: 8px;
      min-width: 100px;
    }

    .info-value {
      color: var(--text);
      flex: 1;
    }

    /* Messages */
    #messages {
      display: flex;
      flex-direction: column;
      gap: var(--line-height);
    }

    .message-timestamp {
      font-size: 10px;
      color: var(--dim);
      opacity: 0.8;
    }

    .user-message {
      background: var(--userMessageBg);
      color: var(--userMessageText);
      padding: var(--line-height);
      border-radius: 4px;
      position: relative;
    }

    .assistant-message {
      padding: 0;
      position: relative;
    }

    /* Copy link button - appears on hover */
    .copy-link-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      padding: 6px;
      background: var(--container-bg);
      border: 1px solid var(--dim);
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .user-message:hover .copy-link-btn,
    .assistant-message:hover .copy-link-btn,
    .skill-user-entry:hover .copy-link-btn {
      opacity: 1;
    }

    .copy-link-btn:hover {
      background: var(--accent);
      color: var(--body-bg);
      border-color: var(--accent);
    }

    .copy-link-btn.copied {
      background: var(--success, #22c55e);
      color: white;
      border-color: var(--success, #22c55e);
    }

    /* Highlight effect for deep-linked messages */
    .user-message.highlight,
    .assistant-message.highlight {
      animation: highlight-pulse 2s ease-out;
    }

    @keyframes highlight-pulse {
      0% {
        box-shadow: 0 0 0 3px var(--accent);
      }
      100% {
        box-shadow: 0 0 0 0 transparent;
      }
    }

    .assistant-message > .message-timestamp {
      padding-left: var(--line-height);
    }

    .assistant-text {
      padding: var(--line-height);
      padding-bottom: 0;
    }

    .message-timestamp + .assistant-text,
    .message-timestamp + .thinking-block {
      padding-top: 0;
    }

    .thinking-block + .assistant-text {
      padding-top: 0;
    }

    .thinking-text {
      padding: var(--line-height);
      color: var(--thinkingText);
      font-style: italic;
      white-space: pre-wrap;
    }

    .message-timestamp + .thinking-block .thinking-text,
    .message-timestamp + .thinking-block .thinking-collapsed {
      padding-top: 0;
    }

    .thinking-collapsed {
      display: none;
      padding: var(--line-height);
      color: var(--thinkingText);
      font-style: italic;
    }

    /* Tool execution */
    .tool-execution {
      padding: var(--line-height);
      border-radius: 4px;
    }

    .tool-execution + .tool-execution {
      margin-top: var(--line-height);
    }

    .assistant-text + .tool-execution {
      margin-top: var(--line-height);
    }

    .tool-execution.pending { background: var(--toolPendingBg); }
    .tool-execution.success { background: var(--toolSuccessBg); }
    .tool-execution.error { background: var(--toolErrorBg); }

    .tool-header, .tool-name {
      font-weight: bold;
    }

    .tool-path {
      color: var(--accent);
      word-break: break-all;
    }

    .line-numbers {
      color: var(--warning);
    }

    .line-count {
      color: var(--dim);
    }

    .tool-command {
      font-weight: bold;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .tool-output {
      margin-top: var(--line-height);
      color: var(--toolOutput);
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      font-family: inherit;
      overflow-x: auto;
    }

    .tool-output > div,
    .output-preview > div,
    .output-full > div {
      margin: 0;
      padding: 0;
      line-height: var(--line-height);
    }

    .tool-output > div:not(.output-preview):not(.output-full),
    .output-preview > div:not(.expand-hint),
    .output-full > div:not(.expand-hint) {
      white-space: pre-wrap;
    }

    .tool-output pre {
      margin: 0;
      padding: 0;
      font-family: inherit;
      color: inherit;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .tool-output code {
      padding: 0;
      background: none;
      color: var(--text);
    }

    .tool-output.expandable {
      cursor: pointer;
    }

    .tool-output.expandable:hover {
      opacity: 0.9;
    }

    .tool-output.expandable .output-full {
      display: none;
    }

    .tool-output.expandable.expanded .output-preview {
      display: none;
    }

    .tool-output.expandable.expanded .output-full {
      display: block;
    }

    .ansi-line {
      white-space: pre;
    }

    .tool-images {
    }

    .tool-image {
      max-width: 100%;
      max-height: 500px;
      border-radius: 4px;
      margin: var(--line-height) 0;
    }

    .expand-hint {
      color: var(--toolOutput);
    }

    /* Diff */
    .tool-diff {
      font-size: 11px;
      overflow-x: auto;
      white-space: pre;
    }

    .diff-added { color: var(--toolDiffAdded); }
    .diff-removed { color: var(--toolDiffRemoved); }
    .diff-context { color: var(--toolDiffContext); }

    /* Model change */
    .model-change {
      padding: 0 var(--line-height);
      color: var(--dim);
      font-size: 11px;
    }

    .model-name {
      color: var(--borderAccent);
      font-weight: bold;
    }

    /* Compaction / Branch Summary - matches customMessage colors from TUI */
    .compaction {
      background: var(--customMessageBg);
      border-radius: 4px;
      padding: var(--line-height);
      cursor: pointer;
    }

    .compaction-label {
      color: var(--customMessageLabel);
      font-weight: bold;
    }

    .compaction-collapsed {
      color: var(--customMessageText);
    }

    .compaction-content {
      display: none;
      color: var(--customMessageText);
      white-space: pre-wrap;
      margin-top: var(--line-height);
    }

    .compaction.expanded .compaction-collapsed {
      display: none;
    }

    .compaction.expanded .compaction-content {
      display: block;
    }

    /* System prompt */
    .system-prompt {
      background: var(--customMessageBg);
      padding: var(--line-height);
      border-radius: 4px;
      margin-bottom: var(--line-height);
    }

    .system-prompt.expandable {
      cursor: pointer;
    }

    .system-prompt-header {
      font-weight: bold;
      color: var(--customMessageLabel);
    }

    .system-prompt-preview {
      color: var(--customMessageText);
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 11px;
      margin-top: var(--line-height);
    }

    .system-prompt-expand-hint {
      color: var(--muted);
      font-style: italic;
      margin-top: 4px;
    }

    .system-prompt-full {
      display: none;
      color: var(--customMessageText);
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 11px;
      margin-top: var(--line-height);
    }

    .system-prompt.expanded .system-prompt-preview,
    .system-prompt.expanded .system-prompt-expand-hint {
      display: none;
    }

    .system-prompt.expanded .system-prompt-full {
      display: block;
    }

    .system-prompt.provider-prompt {
      border-left: 3px solid var(--warning);
    }

    .system-prompt-note {
      font-size: 10px;
      font-style: italic;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Tools list */
    .tools-list {
      background: var(--customMessageBg);
      padding: var(--line-height);
      border-radius: 4px;
      margin-bottom: var(--line-height);
    }

    .tools-header {
      font-weight: bold;
      color: var(--customMessageLabel);
      margin-bottom: var(--line-height);
    }

    .tool-item {
      font-size: 11px;
    }

    .tool-item-name {
      font-weight: bold;
      color: var(--text);
    }

    .tool-item-desc {
      color: var(--dim);
    }

    .tool-params-hint {
      color: var(--muted);
      font-style: italic;
    }

    .tool-item:has(.tool-params-hint) {
      cursor: pointer;
    }

    .tool-params-hint::after {
      content: '[click to show parameters]';
    }

    .tool-item.params-expanded .tool-params-hint::after {
      content: '[hide parameters]';
    }

    .tool-params-content {
      display: none;
      margin-top: 4px;
      margin-left: 12px;
      padding-left: 8px;
      border-left: 1px solid var(--dim);
    }

    .tool-item.params-expanded .tool-params-content {
      display: block;
    }

    .tool-param {
      margin-bottom: 4px;
      font-size: 11px;
    }

    .tool-param-name {
      font-weight: bold;
      color: var(--text);
    }

    .tool-param-type {
      color: var(--dim);
      font-style: italic;
    }

    .tool-param-required {
      color: var(--warning, #e8a838);
      font-size: 10px;
    }

    .tool-param-optional {
      color: var(--dim);
      font-size: 10px;
    }

    .tool-param-desc {
      color: var(--dim);
      margin-left: 8px;
    }

    /* Hook/custom messages */
    .hook-message {
      background: var(--customMessageBg);
      color: var(--customMessageText);
      padding: var(--line-height);
      border-radius: 4px;
    }

    .hook-type {
      color: var(--customMessageLabel);
      font-weight: bold;
    }

    /* Skill invocation - matches compaction style (clickable, collapsed by default) */
    .skill-invocation {
      background: var(--customMessageBg);
      border-radius: 4px;
      padding: var(--line-height);
      cursor: pointer;
    }

    .skill-invocation-label {
      color: var(--customMessageLabel);
      font-weight: bold;
    }

    .skill-invocation-collapsed {
      color: var(--customMessageText);
    }

    .skill-invocation-content {
      display: none;
      color: var(--customMessageText);
      margin-top: var(--line-height);
    }

    .skill-invocation.expanded .skill-invocation-collapsed {
      display: none;
    }

    .skill-invocation.expanded .skill-invocation-content {
      display: block;
    }

    .skill-invocation + .user-message {
      margin-top: var(--line-height);
    }

    .skill-user-entry {
      position: relative;
    }

    /* Branch summary */
    .branch-summary {
      background: var(--customMessageBg);
      padding: var(--line-height);
      border-radius: 4px;
    }

    .branch-summary-header {
      font-weight: bold;
      color: var(--borderAccent);
    }

    /* Error */
    .error-text {
      color: var(--error);
      padding: 0 var(--line-height);
    }
    .tool-error {
      color: var(--error);
    }

    /* Images */
    .message-images {
      margin-bottom: 12px;
    }

    .message-image {
      max-width: 100%;
      max-height: 400px;
      border-radius: 4px;
      margin: var(--line-height) 0;
    }

    /* Markdown content */
    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      color: var(--mdHeading);
      margin: var(--line-height) 0 0 0;
      font-weight: bold;
    }

    .markdown-content h1 { font-size: 1em; }
    .markdown-content h2 { font-size: 1em; }
    .markdown-content h3 { font-size: 1em; }
    .markdown-content h4 { font-size: 1em; }
    .markdown-content h5 { font-size: 1em; }
    .markdown-content h6 { font-size: 1em; }
    .markdown-content p { margin: 0; }
    .markdown-content p + p { margin-top: var(--line-height); }

    .markdown-content a {
      color: var(--mdLink);
      text-decoration: underline;
    }

    .markdown-content code {
      background: rgba(128, 128, 128, 0.2);
      color: var(--mdCode);
      padding: 0 4px;
      border-radius: 3px;
      font-family: inherit;
    }

    .markdown-content pre {
      background: transparent;
      margin: var(--line-height) 0;
      overflow-x: auto;
    }

    .markdown-content pre code {
      display: block;
      background: none;
      color: var(--text);
    }

    .markdown-content blockquote {
      border-left: 3px solid var(--mdQuoteBorder);
      padding-left: var(--line-height);
      margin: var(--line-height) 0;
      color: var(--mdQuote);
      font-style: italic;
    }

    .markdown-content ul,
    .markdown-content ol {
      margin: var(--line-height) 0;
      padding-left: calc(var(--line-height) * 2);
    }

    .markdown-content li { margin: 0; }
    .markdown-content li::marker { color: var(--mdListBullet); }

    .markdown-content hr {
      border: none;
      border-top: 1px solid var(--mdHr);
      margin: var(--line-height) 0;
    }

    .markdown-content table {
      border-collapse: collapse;
      margin: 0.5em 0;
      width: 100%;
    }

    .markdown-content th,
    .markdown-content td {
      border: 1px solid var(--mdCodeBlockBorder);
      padding: 6px 10px;
      text-align: left;
    }

    .markdown-content th {
      background: rgba(128, 128, 128, 0.1);
      font-weight: bold;
    }

    .markdown-content img {
      max-width: 100%;
      border-radius: 4px;
    }

    /* Syntax highlighting */
    .hljs { background: transparent; color: var(--text); }
    .hljs-comment, .hljs-quote { color: var(--syntaxComment); }
    .hljs-keyword, .hljs-selector-tag { color: var(--syntaxKeyword); }
    .hljs-number, .hljs-literal { color: var(--syntaxNumber); }
    .hljs-string, .hljs-doctag { color: var(--syntaxString); }
    /* Function names: hljs v11 uses .hljs-title.function_ compound class */
    .hljs-function, .hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--syntaxFunction); }
    /* Types: hljs v11 uses .hljs-title.class_ for class names */
    .hljs-type, .hljs-class, .hljs-title.class_, .hljs-built_in { color: var(--syntaxType); }
    .hljs-attr, .hljs-variable, .hljs-variable.language_, .hljs-params, .hljs-property { color: var(--syntaxVariable); }
    .hljs-meta, .hljs-meta .hljs-keyword, .hljs-meta .hljs-string { color: var(--syntaxKeyword); }
    .hljs-operator { color: var(--syntaxOperator); }
    .hljs-punctuation { color: var(--syntaxPunctuation); }
    .hljs-subst { color: var(--text); }

    /* Footer */
    .footer {
      margin-top: 48px;
      padding: 20px;
      text-align: center;
      color: var(--dim);
      font-size: 10px;
    }

    /* Mobile */
    #hamburger {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 3px 8px;
      font-size: 12px;
      font-family: inherit;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--dim);
      border-radius: 3px;
      cursor: pointer;
    }

    #hamburger:hover {
      color: var(--text);
      border-color: var(--text);
    }



    #sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 98;
    }

    @media (max-width: 900px) {
      #sidebar {
        position: fixed;
        left: 0;
        width: min(var(--sidebar-width), 100vw);
        min-width: min(var(--sidebar-width), 100vw);
        max-width: min(var(--sidebar-width), 100vw);
        top: 0;
        bottom: 0;
        height: 100vh;
        z-index: 99;
        transform: translateX(-100%);
        transition: transform 0.3s;
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar-resizer {
        display: none;
      }

      #sidebar-overlay.open {
        display: block;
      }

      #hamburger {
        display: block;
      }

      .sidebar-close {
        display: block;
      }

      #content {
        padding: var(--line-height) 16px;
      }

      #content > * {
        max-width: 100%;
      }
    }

    @media print {
      #sidebar, #sidebar-resizer, #sidebar-toggle { display: none !important; }
      body { background: white; color: black; }
      #content { max-width: none; }
    }

/* ION: only collapse tool output when opening it reveals more than three lines. */

    /* ION export shell: self-contained, responsive and optimized for long sessions. */
    :root {

    body {
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(14, 116, 144, 0.08), transparent 28rem),
        #f3f5f7;

    code, pre, .tree-container, .info-value, .tool-output {

    /* Top session masthead */
    #ion-stats-banner {

      width: min(100%, var(--ion-shell-max));

      align-items: center;
    }
    .ion-title-kicker,
    .ion-overview-kicker {
      display: block;

    .ion-session-title {

    .ion-metric-label {

    .ion-tool-badges {

    .ion-tool-badge {
      padding: 3px 9px;

      background: rgba(14, 116, 144, 0.2);

    /* Entry filters sit above an order-proportional, gap-free timeline. */
    #ion-ext-viz {
      width: min(100%, var(--ion-shell-max));
      margin: 18px auto 0;
      padding: 0 28px;

      grid-template-columns: 1fr;

    .ion-overview-panel {
      min-width: 0;

    .ion-flow-groups {

    .ion-flow-group-label {

    .ion-flow-chip,
    .ion-entry-provenance-chip {
      display: inline-flex;

      gap: 4px;

    .ion-entry-type-controls {
      display: flex;

    }
    .ion-entry-filter,
    .ion-entry-filter-reset {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid color-mix(in srgb, var(--entry-color) 48%, white);
      border-radius: 999px;
      color: color-mix(in srgb, var(--entry-color) 82%, #101828);
      background: color-mix(in srgb, var(--entry-color) 9%, white);

      transition: opacity 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .ion-entry-filter:hover { background: color-mix(in srgb, var(--entry-color) 16%, white); }
    .ion-entry-filter[aria-pressed="false"] { opacity: 0.36; filter: grayscale(0.6); }
    .ion-entry-filter-count { opacity: 0.64; font-weight: 550; }
    .ion-entry-filter-reset {
      --entry-color: #667085;
      color: #475467;

    .ion-entry-filter-reset:disabled { opacity: 0.35; cursor: default; }
    .ion-entry-swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--entry-color);
      box-shadow: 0 0 0 1px rgba(16, 24, 40, 0.08);
    }
    .ion-timeline-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0 4px;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }
    .ion-timeline-track {
      position: relative;
      display: flex;
      width: var(--timeline-content-width, 12px);
      min-width: 12px;
      height: 32px;
      overflow: visible;
      border: 1px solid #e4e7ec;
      border-radius: 7px;
      background: #fbfcfd;
    }
    .ion-timeline-bar {
      position: relative;
      flex: 0 0 12px;
      top: 3px;
      width: 12px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      z-index: 1;
    }
    .ion-timeline-bar::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      border-right: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 0;
      background: var(--bar-color);
      opacity: 0.9;
      transition: opacity 120ms ease, transform 120ms ease, box-shadow 120ms ease;
    }
    .ion-timeline-bar:hover,
    .ion-timeline-bar:focus-visible {
      z-index: 3;
      outline: none;
    }
    .ion-timeline-bar:hover::before,
    .ion-timeline-bar:focus-visible::before {
      opacity: 1;

    .ion-timeline-empty {

    .ion-timeline-axis {

    /* Center the whole workspace and keep the navigation/content ratio useful. */

    #sidebar {

    #content {

    /* Long Entries keep their real rendered content visible for a few lines. */
    #messages > [id^="entry-"].ion-entry-fold {
      position: relative;

    .ion-entry-fold-content {
      display: block;

      display: block;

    .ion-entry-fold.compaction .compaction-collapsed { display: none !important; }
    .ion-entry-fold.compaction .compaction-content { display: block !important; }

    /* Message roles: quiet cards with an unmistakable edge marker. */
    .user-message {
      background: #edf6ff !important;
      border: 1px solid #d6e8f8 !important;
      border-left: 3px solid #2e90fa !important;
      padding: 14px 16px !important;
      border-radius: 12px !important;
      margin-bottom: 0 !important;
    }
    /* Memory/context injection: collapse by default to avoid visual repetition */
    .user-message.memory-injection {
      background: #f8fafc !important;
      border-left: 3px solid #94a3b8 !important;
      border-color: #e2e8f0 !important;
      max-height: 60px;
      overflow: hidden;
      position: relative;
      cursor: pointer;

    .user-message.memory-injection::after {

      color: #64748b;
      padding-bottom: 2px;

    .user-message::before {
      content: "USER";
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #175cd3;
      margin-bottom: 6px;
      text-transform: uppercase;

      background: #fbfefc !important;
      border-radius: 12px !important;
      margin-bottom: 0 !important;
    }
    .assistant-message::before {
      content: "ASSISTANT";
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #067647;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tool-execution {
      border-left: 3px solid #f79009 !important;
      background: #fffbeb !important;
      padding: 8px 12px !important;
      border-radius: 8px !important;
      margin-bottom: 8px !important;
    }
    .tool-execution::before {
      content: "TOOL RESULT";
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #f59e0b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* custom_message（sub_session_separator 等）特殊样式 */
    .custom-message {
      border-left: 3px solid #8b5cf6 !important;
      background: #f5f3ff !important;
      padding: 12px 16px !important;
      border-radius: 10px !important;
      margin-bottom: 8px !important;
    }
    /* 不同 customType 用不同颜色（用户反馈：自定义插入应有视觉区分）*/
    .hook-message[data-custom-type="diagnostics"] {
      border-left-color: #dc2626 !important;
      background: #fef2f2 !important;
    }
    .hook-message[data-custom-type="diagnostics"][data-has-errors="false"] {

    .hook-message[data-custom-type="dev_servers"] {
      border-left-color: #ec4899 !important;
      background: #fdf2f8 !important;
    }
    .hook-message[data-custom-type="session_name"] {
      border-left-color: #0891b2 !important;
      background: #ecfeff !important;
    }
    /* session_name 卡片：用更显著的渐变背景，区别于普通 custom_message */
    .custom-message[data-custom-type="session_name"],
    .custom-message.session-name-card {
      border-left: 3px solid #0891b2 !important;
      background: linear-gradient(90deg, #ecfeff 0%, #cffafe 100%) !important;
      padding: 10px 16px !important;
      border-radius: 6px !important;
      margin: 8px 0 !important;
      font-size: 13px !important;
    }
    /* tree-view 里 session_name 节点也用青色高亮 */
    .tree-node[data-custom-type="session_name"] .tree-custom {
      color: #0891b2 !important;
      font-weight: 600 !important;
    }
    /* hook_event 审计卡片：判断方式 / Agent 推理过程 */
    .hook-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #e2e8f0;
    }
    .hook-meta-item {
      font-size: 12px;
      color: #64748b;
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .hook-meta-item b {
      color: #475569;
      font-weight: 600;
    }
    .hook-reasoning {
      margin-top: 6px;
    }
    .hook-reasoning summary {
      font-size: 12px;
      color: #6366f1;
      cursor: pointer;
      user-select: none;
    }
    .hook-reasoning summary:hover {
      text-decoration: underline;
    }
    .hook-reasoning-text {
      margin-top: 6px;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      color: #475569;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ion-generic-entry {
      position: relative;
      padding: 10px 13px;
      border: 1px solid #e2e8f0;
      border-left: 3px solid #667085;
      border-radius: 9px;
      background: #f8fafc;
      color: #344054;
    }
    .ion-generic-entry-type {
      margin-bottom: 4px;
      color: #475467;
      font: 700 10px/1.35 "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.03em;
    }
    .ion-generic-entry-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 500 11px/1.55 "SFMono-Regular", Menlo, monospace;
    }
    .ion-entry-provenance {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 7px 0 5px;
      padding-top: 7px;
      border-top: 1px dashed #d0d5dd;
    }
    .ion-entry-provenance-chip[data-kind="phase"] {
      color: #175cd3;
      border-color: #b2ddff;
      background: #eff8ff;
    }
    .ion-entry-provenance-chip[data-kind="source"] {
      color: #6941c6;
      border-color: #d9d6fe;
      background: #f4f3ff;
    }
    .ion-entry-provenance-chip[data-kind="llm"] {
      color: #027a48;
      border-color: #abefc6;
      background: #ecfdf3;
    }
    .ion-entry-provenance-chip[data-kind="hidden"] {
      color: #b54708;
      border-color: #fedf89;
      background: #fffaeb;
    }
    .ion-entry-filter-hidden { display: none !important; }
    .ion-entry-nested-events {
      display: grid;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #d0d5dd;
    }
    .ion-entry-nested-events > .hook-message {
      margin: 0 !important;
      padding: 7px 9px !important;
      border: 1px solid #ddd6fe !important;
      border-left: 3px solid #8b5cf6 !important;
      border-radius: 7px !important;
      background: #f5f3ff !important;
      font-size: 11px !important;
    }
    .ion-entry-nested-events > .hook-message .message-timestamp {
      margin-bottom: 3px;
    }
    .ion-entry-nested-events > .hook-message .hook-type {
      font-size: 9px;
    }
    /* ION: 每个 toolCall 独立一行 + 间距 + 背景色（对标 toolResult） */
    .assistant-message .tool-execution {
      display: block !important;
      margin-bottom: 8px !important;
      padding: 8px 12px !important;
      border-radius: 8px !important;
      border-left: 3px solid #f59e0b !important;
      background: #fffbeb !important;
    }
    .assistant-message .tool-execution.error {
      border-left-color: #dc2626 !important;
      background: #fef2f2 !important;
    }
    .assistant-message .tool-execution.success {
      border-left-color: #10b981 !important;
      background: #f0fdf4 !important;
    }
    /* ION: 输出折叠——头 N 行 + 尾 N 行（中间压缩，不是只折叠尾部） */
    .expandable-output .output-tail {
      display: block !important;
    }
    .tool-output:not(.expandable)[data-ion-output-foldable="true"]:not(.expanded)::after {
      color: #0e7490;
      background: linear-gradient(transparent, rgba(248, 250, 252, 0.98) 56%);
    }

    @media (max-width: 1100px) {
      .ion-stats-inner { grid-template-columns: 1fr; }
      .ion-session-metrics { flex-wrap: wrap; }
      .ion-tool-badges { grid-column: auto; margin-top: -6px; }
      #ion-ext-viz { grid-template-columns: 1fr; }
      #app { grid-template-columns: 280px minmax(0, 1fr); }
    }
    @media (max-width: 900px) {
      .ion-stats-inner { min-height: 0; padding: 18px 20px; }
      .ion-title-block { padding-left: 44px; }
      .ion-session-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ion-session-metric, .ion-session-metric--model { min-width: 0; }
      #ion-ext-viz { margin-top: 12px; padding: 0 12px; }
      #app { display: block; padding: 12px 12px 28px; }
      #sidebar {
        width: min(var(--sidebar-width), calc(100vw - 24px));
        min-width: min(var(--sidebar-width), calc(100vw - 24px));
        max-width: min(var(--sidebar-width), calc(100vw - 24px));
        height: 100vh;
        top: 0;
        border-radius: 0 14px 14px 0;
      }
      #content { padding: 0; }
      #hamburger {
        top: 12px;
        left: 12px;
        padding: 7px 9px;
        border-color: rgba(255, 255, 255, 0.3);
        color: #fff;
        background: rgba(16, 24, 40, 0.76);
        backdrop-filter: blur(8px);
      }
      .header-info { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .ion-session-title { font-size: 20px; }
      .ion-session-metrics { grid-template-columns: 1fr; }
      .ion-overview-panel { padding: 14px; }
      .ion-flow-metrics { grid-template-columns: repeat(3, minmax(86px, 1fr)); }
      .header { padding: 14px; border-radius: 12px; }
      .help-hint { display: none; }
      .help-actions { width: 100%; }
      .header-toggle-btn, .download-json-btn { flex: 1; }
      .info-item { display: block; }
      .info-label { display: block; min-width: 0; margin: 0 0 2px; }
    }
    @media print {
      #ion-stats-banner { background: #fff !important; color: #101828; border-bottom: 2px solid #101828; }
      .ion-session-title, .ion-session-metric strong { color: #101828; }
      #ion-ext-viz, #app { width: 100%; max-width: none; padding-left: 0; padding-right: 0; }
      #ion-ext-viz { display: block; }
      .ion-overview-panel { margin-bottom: 10px; box-shadow: none; }
      #content { display: block; }
      .header, .user-message, .assistant-message { box-shadow: none; break-inside: avoid; }
    }
    </style>
</head>
