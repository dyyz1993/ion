<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ION Host Dashboard</title>
<style>
  /* ─── 主题变量：默认暗色，light 用 [data-theme="light"] 覆盖 ─── */
  :root {
    --bg: #1a1a2e;          /* 主背景 */
    --sidebar-bg: #111118;  /* 侧栏背景 */
    --text: #e4e4e7;        /* 主文字 */
    --border: #27272a;      /* 边框 */
    --muted: #8b8b94;       /* 次要文字 */
    --card-bg: #16161f;     /* 卡片/气泡背景 */
    --hover-bg: #1f1f2b;    /* hover 背景 */
    --active-bg: #3b5bdb;   /* 选中/用户气泡 */
    --accent: #4dabf7;      /* 强调色（标题/链接） */
    --ok: #3fb950;          /* 成功 / diff 新增（绿） */
    --err: #f85149;         /* 错误 / diff 删除（红） */
    --warn: #d29922;        /* 警告 */
    --tool-accent: #f78166; /* 工具卡左侧条 */
    --diff-add-bg: rgba(63, 185, 80, 0.12);  /* diff 新增行背景 */
    --diff-del-bg: rgba(248, 81, 73, 0.12);  /* diff 删除行背景 */
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --sidebar-bg: #f4f4f5;
    --text: #18181b;
    --border: #d4d4d8;
    --muted: #71717a;
    --card-bg: #f4f4f5;
    --hover-bg: #e4e4e7;
    --active-bg: #3b5bdb;
    --accent: #1c7ed6;
    --ok: #2b8a3e;
    --err: #c92a2a;
    --warn: #b8860b;
    --tool-accent: #e8590c;
    --diff-add-bg: rgba(43, 138, 62, 0.12);
    --diff-del-bg: rgba(201, 42, 42, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  .sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 18px; color: var(--accent); margin-bottom: 4px; }
  .status { font-size: 12px; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .status.ok { color: var(--ok); } .status.ok .dot { background: var(--ok); }
  .status.err { color: var(--err); } .status.err .dot { background: var(--err); }
  .status.con { color: var(--warn); } .status.con .dot { background: var(--warn); }
  .new-task { padding: 12px; border-bottom: 1px solid var(--border); }
  .new-task button { width: 100%; padding: 8px; background: var(--ok); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .new-task button:hover { filter: brightness(1.1); }
  .session-list { flex: 1; overflow-y: auto; }
  .session-list h3 { padding: 12px 16px 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .session-item { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
  .session-item:hover { background: var(--hover-bg); }
  .session-item.active { background: var(--active-bg); color: #fff; }
  .session-item .title { display: block; margin-bottom: 2px; }
  .session-item .meta { font-size: 11px; color: var(--muted); }
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .topbar { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .topbar h2 { font-size: 15px; }
  .workers-badges { font-size: 12px; color: var(--muted); }
  .workers-badges .badge { display: inline-block; padding: 2px 8px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; margin-left: 6px; }
  .conversation { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin-bottom: 16px; max-width: 80%; }
  .msg.user { margin-left: auto; }
  .msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user .msg-bubble { background: var(--active-bg); color: #fff; }
  .msg.assistant .msg-bubble { background: var(--card-bg); min-height: 20px; }
  .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--tool-accent); border-radius: 6px; padding: 10px; margin: 8px 0; font-size: 12px; }
  .tool-card .tool-name { color: var(--tool-accent); font-weight: 600; margin-bottom: 4px; }
  .tool-card .tool-args { color: var(--muted); font-family: monospace; white-space: pre-wrap; word-break: break-all; }
  .tool-card .tool-result { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); color: var(--ok); }
  .thinking { font-size: 12px; color: var(--warn); padding: 8px 0; }
  .thinking::after { content: " ●"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .composer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .composer input { flex: 1; padding: 10px 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
  .composer button { padding: 10px 20px; background: var(--ok); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .composer button:disabled { background: var(--card-bg); color: var(--muted); cursor: not-allowed; }
  .worker-tray { position: fixed; right: 16px; bottom: 80px; width: 240px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12px; max-height: 50vh; overflow-y: auto; }
  .worker-tray h4 { color: var(--accent); margin-bottom: 8px; font-size: 12px; }
  .worker-row { display: flex; justify-content: space-between; padding: 3px 0; }
  .worker-row .name { color: var(--text); }
  .worker-row .state { font-size: 11px; }
  .state.idle { color: var(--muted); } .state.busy { color: var(--warn); } .state.dead { color: var(--err); } .state.stale { color: #a371f7; }
  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 13px; }
  .sys-error { background: var(--diff-del-bg) !important; color: var(--err) !important; }
  .msg-bubble .diff-add { color: var(--ok); background: var(--diff-add-bg); display: block; }
  .msg-bubble .diff-del { color: var(--err); background: var(--diff-del-bg); display: block; }
  /* 主题切换按钮 */
  .theme-toggle { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .theme-toggle:hover { background: var(--hover-bg); }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>ION Host</h1>
    <div class="status con" id="status"><span class="dot"></span> <span id="status-text">连接中…</span></div>
  </div>
  <div class="new-task">
    <button onclick="newTask()">+ 新建任务</button>
  </div>
  <div class="session-list">
    <h3>会话（list_sessions）</h3>
    <div id="session-list"><div class="empty">（连接后加载）</div></div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <h2 id="task-title">尚无任务</h2>
    <div style="display:flex;align-items:center;gap:12px;"><button class="theme-toggle" id="theme-toggle" title="切换主题">🌙</button><div class="workers-badges" id="workers-badges">Workers <span class="badge">?</span></div></div>
  </div>
  <div class="conversation" id="conversation">
    <div class="empty">在下方输入框给 agent 派活，或点「+ 新建任务」。</div>
  </div>
  <div class="composer">
    <input id="prompt-input" placeholder="给 agent 派任务（如：用 web-search 查 xxx 并总结）…">
    <button id="send-btn" disabled>派活</button>
  </div>
</div>

<div class="worker-tray">
  <h4>Worker 状态</h4>
  <div id="worker-list"><div class="empty">（无）</div></div>
</div>

<script>
// ─── WebSocket 连接 ─────────────────────────────────────────────
// 浏览器连当前页面的 /ws（同源，不需要绝对 URL）。但本网关实现里 WS 走的是同端口
// 的 upgrade，所以直接连 ws://当前host/。
let ws = null;
let connected = false;
let pendingToolCards = {}; // toolCallId → DOM 元素，等结果回来填进去
let currentAssistantBubble = null; // 当前正在流式拼接的 assistant 气泡

function setStatus(cls, text) {
  const s = document.getElementById('status');
  s.className = 'status ' + cls;
  document.getElementById('status-text').textContent = text;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/');

  ws.onopen = () => {
    connected = true;
    setStatus('ok', '已连接');
    document.getElementById('send-btn').disabled = false;
    // 连上后立即 subscribe 事件流 + 拉一次状态
    ws.send(JSON.stringify({ type: 'subscribe' }));
    refreshOverview();
    refreshSessions();
    refreshWorkers();
    // 定期刷新 worker / session 列表
    setInterval(refreshWorkers, 3000);
    setInterval(refreshSessions, 10000);
    setInterval(refreshOverview, 5000);

    // 绑定输入框 Enter + 按钮点击（用 addEventListener，比 inline onkeydown 更健壮，
    // 某些浏览器自动化/WebView 对 inline handler 的事件模拟不到位）
    const inp = document.getElementById('prompt-input');
    const btn = document.getElementById('send-btn');
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.keyCode === 13) sendPrompt(); });
    btn.addEventListener('click', () => sendPrompt());
  };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleIonMessage(msg);
  };
  ws.onclose = () => {
    connected = false;
    setStatus('err', '已断开（5s 后重连）');
    document.getElementById('send-btn').disabled = true;
    setTimeout(connect, 5000);
  };
  ws.onerror = () => setStatus('err', '连接错误');
}

// ─── 处理 ion 发来的消息（事件 + 响应）──────────────────────────
function handleIonMessage(msg) {
  // 调试：打印每条消息的 type 和 customType（IAB 开发者工具 console 可见）
  console.log('[ion-msg]', msg.type, msg.customType || '', msg.event?.type || '');

  // 去重：同一事件可能被 reader + pump + session SUB 重复转发。
  // 用 timestamp + type 去重（同一毫秒的同类型事件只处理第一条）。
  const dedupKey = (msg.timestamp || msg.data?.event?.timestamp || '') + '|' + (msg.customType || msg.event?.type || msg.data?.event?.type || '');
  if (dedupKey && dedupKey !== '|') {
    if (window._lastDedupKeys && window._lastDedupKeys.has(dedupKey)) return;
    window._lastDedupKeys = window._lastDedupKeys || new Set();
    window._lastDedupKeys.add(dedupKey);
    // 保留最近 200 个 key，防止内存涨
    if (window._lastDedupKeys.size > 200) {
      const arr = Array.from(window._lastDedupKeys);
      window._lastDedupKeys = new Set(arr.slice(-200));
    }
  }

  // ion 的事件格式（实测）：
  //   全局订阅推的 extension_event: { type:"extension_event", customType:"text_delta",
  //                                    extension:"worker", data:{ event:{ delta:"Hi", type:"text_delta" } } }
  //   worker 原始事件: { type:"event", event:{ type:"text_delta", delta:"..." } }
  //   RPC 响应: { type:"response", id, success, data }
  if (msg.type === 'event' && msg.event) {
    handleEvent(msg.event);
  } else if (msg.type === 'extension_event' && msg.data && msg.data.event) {
    // 全局订阅收到的 worker 事件（customType=原始类型，data.event=完整事件）
    handleEvent(msg.data.event);
  } else if (msg.event && msg.event.type) {
    handleEvent(msg.event);
  } else if (msg.type === 'response' || msg.id) {
    handleResponse(msg);
  } else if (msg.type === 'ion_error') {
    appendSystem('⚠ ion socket 错误: ' + (msg.message || ''));
  } else if (msg.type === 'ion_closed') {
    appendSystem('⚠ ion socket 关闭');
  } else if (msg.type === 'rpc_sent') {
    // 网关确认收到，不显示
  } else if (msg.type === 'raw') {
    // 无法解析的行
  }
}

function handleEvent(ev) {
  const t = ev.type;
  if (t === 'text_delta') {
    // 流式拼接 assistant 回复
    ensureAssistantBubble();
    if (currentAssistantBubble) {
      currentAssistantBubble.textContent += (ev.delta || '');
      scrollConv();
    }
  } else if (t === 'agent_start' || t === 'process_started') {
    showThinking();
  } else if (t === 'agent_end' || t === 'agent_stopped') {
    hideThinking();
    finalizeAssistantBubble();
  } else if (t === 'message_end') {
    hideThinking();
  } else if (t === 'tool_execution_start' || ev.toolCallId && ev.toolName) {
    hideThinking();
    const card = addToolCard(ev.toolName, ev.arguments || ev.args || {});
    if (ev.toolCallId) pendingToolCards[ev.toolCallId] = card;
  } else if (t === 'tool_execution_end') {
    hideThinking();
    const card = ev.toolCallId && pendingToolCards[ev.toolCallId];
    if (card) {
      const res = card.querySelector('.tool-result');
      const ok = ev.isError ? '✗' : '✓';
      const resultStr = typeof ev.result === 'string' ? ev.result.slice(0, 200) : JSON.stringify(ev.result).slice(0, 200);
      res.textContent = ok + ' ' + resultStr;
      delete pendingToolCards[ev.toolCallId];
    }
  } else if (t === 'error') {
    appendSystem('⚠ ' + (ev.message || JSON.stringify(ev)));
  } else if (t === 'worker_created' || t === 'worker_destroyed' || t === 'project_changed') {
    refreshWorkers();
    refreshOverview();
  }
  // 其他事件类型静默（process_completed, customType: memory_* 等不显示）
}

function handleResponse(msg) {
  // list_workers / get_overview / list_sessions 的响应
  if (msg.method === 'list_workers' || (msg.data && msg.data.workers)) {
    renderWorkers(msg.data && msg.data.workers || []);
  } else if (msg.method === 'get_overview' || (msg.data && 'total_workers' in msg.data)) {
    renderOverview(msg.data || {});
  } else if (msg.method === 'list_sessions' || (msg.data && msg.data.sessions)) {
    renderSessions(msg.data && msg.data.sessions || []);
  }
}

// ─── RPC 调用 ───────────────────────────────────────────────────
function rpc(method, params) {
  if (!connected) return;
  ws.send(JSON.stringify({ type: 'rpc', method, params: params || {} }));
}
function refreshWorkers() { rpc('list_workers', {}); }
function refreshOverview() { rpc('get_overview', {}); }
function refreshSessions() { rpc('list_sessions', {}); }

// ─── 派活（创建 worker）────────────────────────────────────────
function sendPrompt() {
  const input = document.getElementById('prompt-input');
  const text = input.value.trim();
  if (!text || !connected) return;
  input.value = '';
  document.getElementById('task-title').textContent = text.slice(0, 40);
  appendUser(text);
  rpc('create_worker', { agent: 'build', initial_prompt: text });
}

function newTask() {
  document.getElementById('prompt-input').focus();
}

// ─── DOM 渲染辅助 ──────────────────────────────────────────────
function appendUser(text) {
  const conv = document.getElementById('conversation');
  if (conv.querySelector('.empty')) conv.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="msg-bubble"></div>';
  div.querySelector('.msg-bubble').textContent = text;
  conv.appendChild(div);
  currentAssistantBubble = null;
  scrollConv();
}

function ensureAssistantBubble() {
  hideThinking();
  if (currentAssistantBubble) return;
  const conv = document.getElementById('conversation');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = '<div class="role">GLM-5.2 · 流式输出中</div><div class="msg-bubble"></div>';
  conv.appendChild(div);
  currentAssistantBubble = div.querySelector('.msg-bubble');
  scrollConv();
}

function finalizeAssistantBubble() {
  if (currentAssistantBubble) {
    const role = currentAssistantBubble.parentElement.querySelector('.role');
    if (role) role.textContent = 'GLM-5.2 · 已完成';
    currentAssistantBubble = null;
  }
}

function addToolCard(name, args) {
  const conv = document.getElementById('conversation');
  if (conv.querySelector('.empty')) conv.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = '<div class="tool-name">🔧 ' + escapeHtml(name) + '</div>' +
                   '<div class="tool-args"></div>' +
                   '<div class="tool-result">执行中…</div>';
  card.querySelector('.tool-args').textContent = JSON.stringify(args, null, 2);
  conv.appendChild(card);
  scrollConv();
  return card;
}

function showThinking() {
  let t = document.getElementById('thinking-indicator');
  if (!t) {
    const conv = document.getElementById('conversation');
    t = document.createElement('div');
    t.id = 'thinking-indicator';
    t.className = 'thinking';
    t.textContent = 'agent 处理中';
    conv.appendChild(t);
  }
  scrollConv();
}
function hideThinking() {
  const t = document.getElementById('thinking-indicator');
  if (t) t.remove();
}

function appendSystem(text) {
  const conv = document.getElementById('conversation');
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = '<div class="msg-bubble" class="sys-error"></div>';
  div.querySelector('.msg-bubble').textContent = text;
  conv.appendChild(div);
  scrollConv();
}

function renderWorkers(workers) {
  const list = document.getElementById('worker-list');
  if (!workers.length) { list.innerHTML = '<div class="empty">（无 worker）</div>'; return; }
  list.innerHTML = workers.map(w => {
    const st = (w.status || 'idle').toLowerCase();
    return '<div class="worker-row"><span class="name">' + escapeHtml((w.workerId || '?').slice(0, 14)) + '</span><span class="state ' + st + '">● ' + st + '</span></div>';
  }).join('');
  // 顶栏徽标
  const counts = {};
  workers.forEach(w => { const s = (w.status || 'idle').toLowerCase(); counts[s] = (counts[s] || 0) + 1; });
  const badges = Object.entries(counts).map(([s, n]) => '<span class="badge">' + s + ' ' + n + '</span>').join('');
  document.getElementById('workers-badges').innerHTML = 'Workers ' + badges;
}

function renderOverview(data) {
  // 状态栏显示 total / mcp 连接数（如果有）
  const txt = 'serve ' + (data.total_workers || 0) + ' workers · ' + (data.total_dead || 0) + ' dead';
  // 不覆盖连接状态，只在 ok 时附加上下文
  if (connected) document.getElementById('status-text').textContent = txt;
}

function renderSessions(sessions) {
  const list = document.getElementById('session-list');
  if (!sessions.length) { list.innerHTML = '<div class="empty">（无会话）</div>'; return; }
  list.innerHTML = sessions.slice(0, 20).map((s, idx) => {
    const sid = (s.session_id || s.sessionId || '?');
    const wid = (s.worker_id || s.workerId || '?').slice(0, 14);
    const display = sid.length > 20 ? sid.slice(0, 20) + '…' : sid;
    return '<div class="session-item" data-sid="' + escapeHtml(sid) + '" onclick="loadSession(\'' + escapeHtml(sid) + '\')"><span class="title">' + escapeHtml(display) + '</span><span class="meta">' + escapeHtml(wid) + '</span></div>';
  }).join('');
}

// 点击会话 → 加载历史消息
async function loadSession(sid) {
  // 高亮选中
  document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
  const target = document.querySelector('.session-item[data-sid="' + sid + '"]');
  if (target) target.classList.add('active');
  // 调网关 API 读 JSONL
  const conv = document.getElementById('conversation');
  conv.innerHTML = '<div class="empty">加载中…</div>';
  document.getElementById('task-title').textContent = '会话: ' + sid.slice(0, 20);
  try {
    const resp = await fetch('/api/session/' + encodeURIComponent(sid));
    const data = await resp.json();
    if (data.error) { conv.innerHTML = '<div class="empty">⚠ ' + data.error + '</div>'; return; }
    conv.innerHTML = '';
    currentAssistantBubble = null;
    for (const msg of data.messages) {
      if (msg.role === 'user') {
        appendUser(msg.content);
      } else if (msg.role === 'assistant') {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        div.innerHTML = '<div class="role">GLM-5.2 · 历史消息</div><div class="msg-bubble"></div>';
        div.querySelector('.msg-bubble').textContent = msg.content;
        conv.appendChild(div);
      } else if (msg.role === 'tool') {
        addToolCard(msg.name, msg.content);
      } else if (msg.role === 'tool_result') {
        const cards = conv.querySelectorAll('.tool-card .tool-result');
        if (cards.length) cards[cards.length - 1].textContent = '✓ ' + msg.content;
      }
    }
    if (!data.messages.length) conv.innerHTML = '<div class="empty">（此会话无消息）</div>';
    scrollConv();
  } catch (e) {
    conv.innerHTML = '<div class="empty">⚠ 加载失败: ' + e.message + '</div>';
  }
}

function scrollConv() {
  const conv = document.getElementById('conversation');
  conv.scrollTop = conv.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ─── 主题切换（localStorage 持久化，刷新保留）────────���────────
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = t === 'dark' ? '🌙' : '☀️';
}
(function initTheme() {
  const saved = localStorage.getItem('ion-theme') || 'dark';
  applyTheme(saved);
})();
document.getElementById('theme-toggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ion-theme', next);
  applyTheme(next);
});

// 启动
connect();
</script>
