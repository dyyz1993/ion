<!-- 笑脸 SVG - 简单的黄色笑脸 -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 黄色圆脸 -->
  <circle cx="100" cy="100" r="90" fill="#FFD700" stroke="#DAA520" stroke-width="3"/>
  
  <!-- 左眼 -->
  <circle cx="70" cy="75" r="12" fill="#333"/>
  
  <!-- 右眼 -->
  <circle cx="130" cy="75" r="12" fill="#333"/>
  
  <!-- 微笑的嘴巴 -->
  <path d="M 55 120 Q 100 165 145 120" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
</svg>
