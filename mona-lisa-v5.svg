  <!-- ★ V5 CROW'S FEET — eye-corner wrinkles activated by genuine smile (Duchenne) -->
  <path d="M 242 406 Q 236 402 231 400" fill="none" stroke="#a07850" stroke-width="1.1" opacity="0.4" stroke-linecap="round"/>
  <path d="M 240 412 Q 233 412 228 412" fill="none" stroke="#a07850" stroke-width="1.0" opacity="0.35" stroke-linecap="round"/>
