  <ellipse cx="352" cy="440" rx="26" ry="20" fill="#d09060" opacity="0.26"/>

  <!-- ★★★ V5 RADICAL SMILE SURROUND — the SMILE is in the SHADING, not just the mouth ★★★ -->
  <!-- (A) NASOLABIAL FOLDS — diagonal shadow grooves from nose to mouth corners, deepened and clearly visible -->
  <path d="M 280 478 Q 268 495 256 512" fill="none" stroke="#7a5230" stroke-width="4" opacity="0.42" stroke-linecap="round" filter="url(#smileBlur)"/>
  <path d="M 320 478 Q 332 495 344 512" fill="none" stroke="#7a5230" stroke-width="4" opacity="0.42" stroke-linecap="round" filter="url(#smileBlur)"/>
  <!-- (B) BULGED CHEEK PADS above mouth corners — a real smile puffs the cheeks outward -->
  <ellipse cx="252" cy="496" rx="14" ry="9" fill="#e0a878" opacity="0.32" filter="url(#smileBlur)"/>
  <ellipse cx="348" cy="496" rx="14" ry="9" fill="#e0a878" opacity="0.32" filter="url(#smileBlur)"/>
