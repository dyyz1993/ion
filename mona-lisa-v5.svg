  <ellipse cx="307" cy="475" rx="3" ry="2" fill="#6a4830" opacity="0.4"/>

  <!-- ★ V5 CHEEK BLUSH — LIFTED UPWARD (zygomatic major contraction pulls cheeks up in a real smile) -->
