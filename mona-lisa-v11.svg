<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4a4030"/>
      <stop offset="25%" stop-color="#6e5e3e"/>
      <stop offset="55%" stop-color="#9a7e48"/>
      <stop offset="100%" stop-color="#b8985a"/>
    </linearGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a2614"/>
      <stop offset="40%" stop-color="#241608"/>
      <stop offset="100%" stop-color="#100a04"/>
    </linearGradient>
    <!-- ★ V11 face gradient with DIRECTIONAL lighting (light from upper-left) -->
    <radialGradient id="faceGrad" cx="0.38" cy="0.35" r="0.62">
      <stop offset="0%"  stop-color="#f0d4a0"/>
      <stop offset="40%" stop-color="#d0a878"/>
      <stop offset="78%" stop-color="#9a6e4a"/>
      <stop offset="100%" stop-color="#6a4830"/>
    </radialGradient>
    <!-- ★ V11 directional shadow overlay for the right/lower side of face -->
    <radialGradient id="faceShadow" cx="0.72" cy="0.62" r="0.55">
      <stop offset="0%"  stop-color="#3a2410" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#3a2410" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3a2410" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.66">
      <stop offset="0%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="veilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7a6e58" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4a4030" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#3a1c08"/>
      <stop offset="45%" stop-color="#6a3818"/>
      <stop offset="80%" stop-color="#4a2410"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </radialGradient>
    <!-- ★ robe shading: directional light from upper-left, shadow on lower-right -->
    <linearGradient id="robeLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#5a3e22" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3a2614" stop-opacity="0"/>
      <stop offset="100%" stop-color="#100a04" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="handGrad" cx="0.42" cy="0.35" r="0.62">
      <stop offset="0%"  stop-color="#ecd0a0"/>
      <stop offset="60%" stop-color="#c8a878"/>
      <stop offset="100%" stop-color="#7a5a3a"/>
    </radialGradient>
    <filter id="sfumatoBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="hazeBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="smileBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="hairBlur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

