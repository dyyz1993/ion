name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'dashboard/**'
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

# Cancel old runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Build + Lint + Unit Tests ─────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq lsof netcat-openbsd
          rustup target add wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --bin ion

      - name: Clippy
        run: cargo clippy --lib -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      # Same-second file_snapshot flakiness was already fixed (turn_id
      # ordering + process-unique dirs); if a Linux-specific failure
      # reappears, add a NAMED `--skip <test>` with reason here — never a
      # blanket continue-on-error.
      - name: Unit tests (ion lib)
        run: cargo test --lib

      - name: Provider tests
        run: cargo test -p ion-provider

  # ─── Job 2: CI Matrix (FauxProvider, no real LLM) ─────────────────
  # 🔴 此前的 "~30 分钟神秘取消" 根因就是本 job 的 timeout-minutes: 30——
  # GitHub job 超时的 conclusion 是 "cancelled"（不是 failure），加上我曾把
  # 45→90 的修改误落到 integration-tests 头上，双重误导排查成"外部干预"。
  # 现已正确设 90，并分片 ×2 并行（strategy.matrix）把每片压到 ~15 分钟。
  # 预检降为 build-only：clippy/fmt/lib/provider 已由 build-and-test 在
  # 同一 commit 门禁过（needs 链保证）。
  ci-matrix:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq lsof netcat-openbsd
          rustup target add wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run CI Matrix shard ${{ matrix.shard }}
        run: |
          chmod +x scripts/run_ci_matrix_parallel.sh
          bash scripts/run_ci_matrix_parallel.sh
        env:
          # P2：soft_delete 在片内并发跑全量 lib（rustc 内存尖峰）时，P3 实测
          # OOM 杀掉邻近脚本的 serve 守护（rpc_event_push host 失联，
          # run 38746153347）。2 片 × P2 = 峰值 4 并发，稳。
          PARALLELISM: 2
          PER_SCRIPT_TIMEOUT: 600
          SHARD_COUNT: 2
          SHARD_INDEX: ${{ matrix.shard }}
          PREFLIGHT_CMDS: "cargo build --bin ion --locked"

      - name: Record run root
        if: always()
        run: |
          ROOT=$(cat /tmp/ci-matrix-latest 2>/dev/null || true)
          echo "CI_RUN_ROOT=${ROOT:-/tmp/ci-matrix-none}" >> $GITHUB_ENV

      - name: Upload CI results (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-s${{ matrix.shard }}
          path: ${{ env.CI_RUN_ROOT }}/results/

      - name: Upload CI logs (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-s${{ matrix.shard }}
          path: ${{ env.CI_RUN_ROOT }}/out/

  # ─── Job 2.5: Integration tests (tests/*.rs on direct pushes) ────
  # Historically pushes only ran `cargo test --lib`; the ~48 integration
  # binaries ran only in pr-gate (`cargo test --tests`), so direct pushes
  # to master skipped them entirely. Two month-plus silent reds shipped
  # that way (u16 fork param drift; e01 delegated-spawn binary bug — see
  # docs/subsystems/worker-rpc.md and docs/LESSONS.md). This job closes
  # the gap. e2e tests stay opt-in via ION_E2E=1 (#[ignore] by default).
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    # 48 个集成二进制 + 全量 lib 重跑，冷缓存实测 ~10-15 分钟；90 上限留余量
    # （此前 45→90 的修改本意是给 ci-matrix 的，误落到这里——2026-10-15 勘误）
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq lsof netcat-openbsd
          rustup target add wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Integration tests spawn target/debug/ion as child workers
      # (tests' worker_bin_path) — build it before running the suite.
      - name: Build ion binary
        run: cargo build --bin ion

      - name: Integration tests (no fail fast, full report)
        run: cargo test --tests --no-fail-fast

  # ─── Job 3: Scenario tests (quick smoke) ──────────────────────────
  scenario-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --bin ion

      - name: Scenario 1 test (quick execution)
        run: |
          echo 'hello' | timeout 30 ./target/debug/ion -p --model faux --provider faux 2>&1 | head -5
        env:
          ION_FAUX_REPLY: 'Hello from faux!'

      - name: Scenario 2 test (host orchestration)
        run: |
          echo 'say hi' | timeout 30 ./target/debug/ion --host --agent build --model faux --provider faux 2>&1 | head -5

      - name: Scenario 3 test (serve mode)
        run: |
          timeout 5 ./target/debug/ion serve &
          sleep 2
          test -S ~/.ion/host.sock && echo 'socket OK' || echo 'no socket'
          kill %1 2>/dev/null || true

      - name: Goal Supervisor E2E (FauxProvider)
        run: |
          chmod +x tests/goal_supervisor_ci.sh
          # 600s：脚本内含 cargo test（Group A），CI 冷缓存重编依赖实测超 120s
          # （r10/r11 连续 exit 124 于 build 后单元测试段，本地热缓存秒过）
          timeout 600 bash tests/goal_supervisor_ci.sh
        env:
          ION_FAUX_REPLY: 'goal test'

      - name: Goal Evolver CI
        run: |
          chmod +x tests/goal_evolver_ci.sh
          timeout 60 bash tests/goal_evolver_ci.sh
