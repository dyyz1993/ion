name: Release

# 编译 Linux x86_64 release 二进制并发布到 GitHub Releases。
# 触发方式：
#   1. 手动触发（Actions → Release → Run workflow，可填 version，默认取 Cargo.toml）
#   2. push tag v* 触发
#
# 产物：ion-x86_64-unknown-linux-gnu.tar.gz
#   ├── ion              ← 主二进制
#   └── install.sh       ← 一键安装脚本（解压到 ~/.local/bin）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本 tag（留空则用 Cargo.toml 的 version）'
        required: false
        default: ''
      prerelease:
        description: '标记为 prerelease'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    # 在 ubuntu-22.04 runner（充足、不排队）里跑 ubuntu:20.04 容器，
    # 编出的二进制依赖 glibc 2.31，兼容 Ubuntu 20.04+ / Debian 11+。
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 30
    permissions:
      contents: write   # softprops/action-gh-release 需要写 Release
    env:
      DEBIAN_FRONTEND: noninteractive   # 容器内 apt 不交互
      AWS_LC_SYS_PREGENERATED_BINDINGS: "1"   # 优先用预生成绑定，减少对 libclang 的依赖
    steps:
      - name: Install build deps (in 20.04 container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libssl-dev \
            cmake golang-go libclang-dev clang \
            gcc-10 g++-10
          # ubuntu:20.04 默认 gcc-9 有 memcmp 代码生成 bug (gcc#95189)，
          # aws-lc-sys 检测到会拒绝编译。装 gcc-10 并设为默认 CC。
          update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-10 100
          update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-10 100
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
          cc --version | head -1

      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Read version from Cargo.toml
        id: version
        shell: bash   # 容器默认 sh 不支持 [[ ]] 和 ${var::n}
        run: |
          # 优先用 dispatch 输入，否则 push tag 名，否则 Cargo.toml
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME}"
          else
            V=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
            # 手动触发且没填 version，加个 build 后缀避免占用正式号
            V="${V}-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA:0:7}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${V}"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: release-linux-x86_64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-linux-x86_64-

      - name: Build release binary
        run: cargo build --release --bin ion

      - name: Verify binary
        run: |
          # 不用 file 命令（容器里没装）。用 readelf 看 interpreter + 冒烟。
          readelf -p .comment target/release/ion 2>/dev/null | grep -m1 GCC || true
          (target/release/ion --version 2>&1 || target/release/ion --help 2>&1) | head -3

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/release/ion dist/ion
          cp .github/assets/install.sh dist/install.sh
          chmod +x dist/ion dist/install.sh
          ARTIFACT="ion-x86_64-unknown-linux-gnu-${{ steps.version.outputs.version }}.tar.gz"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_ENV"
          tar -C dist -czf "${ARTIFACT}" ion install.sh
          ls -la "${ARTIFACT}"

      - name: Create / update Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ion ${{ steps.version.outputs.version }}
          prerelease: ${{ inputs.prerelease != false }}
          files: |
            ${{ env.artifact }}
          body: |
            ## ion ${{ steps.version.outputs.version }}

            Linux x86_64 release binary，在 ubuntu:20.04 容器 (glibc 2.31) 中编译，
            兼容 glibc 2.31+（Ubuntu 20.04+ / Debian 11+ / Ubuntu 22.04 / Debian 12）。

            ### 一键安装
            ```bash
            curl -fsSL https://github.com/dyyz1993/ion/releases/download/${{ steps.version.outputs.version }}/ion-x86_64-unknown-linux-gnu-${{ steps.version.outputs.version }}.tar.gz \
              | tar -xz -C ~/.local/bin ion
            ```

            或下载安装脚本：
            ```bash
            curl -fsSL https://github.com/dyyz1993/ion/releases/download/${{ steps.version.outputs.version }}/ion-x86_64-unknown-linux-gnu-${{ steps.version.outputs.version }}.tar.gz \
              | tar -xz -C /tmp
            /tmp/install.sh
            ```
          fail_on_unmatched_files: true
