<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- ★★★ V8 SKY — aged-varnish amber/golden patina (raw sienna + yellowed varnish) ★★★ -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4a4030"/>
      <stop offset="25%" stop-color="#6e5e3e"/>
      <stop offset="55%" stop-color="#9a7e48"/>
      <stop offset="100%" stop-color="#b8985a"/>
    </linearGradient>
    <!-- ★ ROBE — burnt umber / dark walnut (Leonardo's deep umber robe) -->
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a2614"/>
      <stop offset="40%" stop-color="#241608"/>
      <stop offset="100%" stop-color="#100a04"/>
    </linearGradient>
    <!-- ★ SKIN — yellowed-varnish sienna: raw sienna highlights + burnt sienna shadows -->
    <radialGradient id="faceGrad" cx="0.5" cy="0.42" r="0.52">
      <stop offset="0%"  stop-color="#ecca94"/>
      <stop offset="45%" stop-color="#d0a878"/>
      <stop offset="80%" stop-color="#a07852"/>
      <stop offset="100%" stop-color="#7a5638"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.66">
      <stop offset="0%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <!-- ★ VEIL — grey-brown gauze (Leonardo's sheer veil reads greyish) -->
    <linearGradient id="veilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7a6e58" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4a4030" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#3a1c08"/>
      <stop offset="45%" stop-color="#6a3818"/>
      <stop offset="80%" stop-color="#4a2410"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </radialGradient>
    <filter id="sfumatoBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="hazeBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="smileBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#skyGrad)"/>

